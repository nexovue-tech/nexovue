[project]
name = "nexovue-api"
version = "0.1.0"
description = "Control-plane API: queries the telemetry store, owns Postgres, serves the web app"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "clickhouse-connect[async]>=1.7",
    "structlog>=24.4",
    # One POST to one endpoint, for the mail provider. Resend recommends its
    # SDK; that would be a vendor package plus this anyway, for a single call.
    "httpx>=0.28",
    # Shared with the other service: logging, request context, redaction.
    "nexovue-platform",
    "argon2-cffi>=23.1",
    # RFC 6238 one-time passwords. The reference Python implementation
    # (pyauth/pyotp, MIT, 2.10.0 on 2026-06-14, current for 3.13). Chosen over
    # writing the HMAC by hand: the specification is short enough to implement
    # and long enough to get wrong in ways no test would notice — counter byte
    # order, dynamic-truncation offset, a comparison that is not constant time.
    "pyotp>=2.10",
    # AES-256-GCM for the TOTP shared secret, which is the one credential here
    # that cannot be hashed. Nothing else in this workspace needed a cipher, so
    # this arrives with the feature that does; `auth/encryption.py` is its only
    # caller and states what the protection is worth.
    "cryptography>=44",
    # Object storage for source map bytes, over the generic S3 API only:
    # SeaweedFS locally, AWS S3 in deployment. boto3 rather than an async
    # wrapper — aiobotocore pins `botocore<1.43.57` and aioboto3 pins
    # `aiobotocore==2.25.1`, either of which would drag the whole workspace's AWS
    # SDK backwards and couple the scheduler's STS code to a third
    # party's release cadence. Its calls run off the event loop through anyio,
    # which Starlette already ships.
    "boto3>=1.35",
    # FastAPI parses no multipart body without it, so an upload endpoint cannot
    # exist until it is declared.
    "python-multipart>=0.0.20",
    # Source map symbolication: Sentry's library. `SourceMapCache.from_bytes`
    # takes the minified bytes *and* the map, and `lookup(line, col, context)`
    # returns the original file, line, name and surrounding source. Rejected the
    # pure-Python readers as abandoned — `sourcemap` last released 2017-08-08.
    # It reads no ECMA-426 debug id: `symbolic`'s debug ids are the native
    # DWARF/Breakpad kind, and a JavaScript one is a plain key in the map's own
    # JSON. Prebuilt py2.py3 wheels cover macOS arm64 and manylinux_2_28, so
    # neither a laptop nor the python:3.13-slim image needs a Rust toolchain.
    "symbolic>=13.9",
    # Run now sends a probe task to the scheduler's broker by name (ADR-011).
    # Only `send_task` is used; no scheduler code is imported.
    "celery[redis]>=5.4",
    # Imports (F18): OpenAPI descriptions in YAML, read with the safe loader and
    # refused on any alias; and validation of Swagger 2.0 and OpenAPI 3.0-3.2.
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.9",
]

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
