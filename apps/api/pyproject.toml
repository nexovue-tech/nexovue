[project]
name = "nexovue-api"
version = "0.1.0"
description = "Control-plane API: queries the telemetry store, owns Postgres, serves the web app"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "clickhouse-connect>=0.8",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
]

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
