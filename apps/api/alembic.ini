# Alembic owns the control-plane schema. The ClickHouse side is deploy/clickhouse/migrations,
# run by apps/workers/cmd/setup — different store, different tool.
#
#   just migrate-pg        apply everything
#   just migrate-down      roll both stores back one step

[alembic]
# %(here)s is this file's directory, so the command works from any cwd.
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Version files sort by their numeric prefix, so `ls` shows migration order.
file_template = %%(rev)s_%%(slug)s

# The URL is resolved in env.py from NEXOVUE_POSTGRES_DSN, because a connection
# string with a password does not belong in a committed file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
