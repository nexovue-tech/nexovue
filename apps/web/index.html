<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>nexovue</title>
    <script>
      // Applies the stored theme before first paint. Inline and blocking on purpose:
      // a deferred script here is a white flash on every load of a dark-first product.
      // Kept in sync with src/shared/theme/theme.ts — same key, same values.
      (() => {
        try {
          const stored = localStorage.getItem("nexovue.theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          } else {
            document.documentElement.removeAttribute("data-theme");
          }
        } catch (_) {
          // Private mode or blocked storage: the CSS default (dark) already applies.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>nexovue needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
