[project]
name = "nexovue-scheduler"
version = "0.1.0"
description = "Doors 2 and 4b: synthetic probes and cloud/database pollers"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "structlog>=24.4",
    # Shared with the other service: logging, request context, redaction.
    "nexovue-platform",
    # libcurl reports each phase of a request separately — DNS, connect, TLS
    # handshake, first byte. That breakdown is the deliverable for P1-34, and
    # httpx (which this replaces) exposes only a total.
    "pycurl>=7.45",
    # The librdkafka wrapper, which is what Confluent and the wider ecosystem
    # recommend for production over the pure-Python clients. A probe publishes
    # its own result, so the producer lives here rather than behind an API.
    "confluent-kafka>=2.6",
    # The envelope and OTLP messages. The generated nexovue bindings are not a
    # distributable package and are imported from the tree; see settings.
    "protobuf>=5.28",
    "opentelemetry-proto>=1.28",
    # Assuming a customer's role and reading CloudWatch. boto3 is AWS's own
    # client and is the only thing that speaks STS's signing.
    "boto3>=1.35",
]

[project.optional-dependencies]
# Only the browser image installs these. Chromium and its dependencies are
# ~1.5GB the light queue has no use for, which is why that image is separate.
browser = ["playwright>=1.62"]

[build-system]
requires = ["uv_build>=0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
