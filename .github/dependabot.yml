version: 2

# Actions are pinned to commit SHAs, which is the only immutable reference a
# workflow can name — a tag can be repointed by whoever controls the repository.
# The cost is that nothing tells you a pin is stale, so Dependabot does: it
# raises the SHA and rewrites the version comment beside it.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
