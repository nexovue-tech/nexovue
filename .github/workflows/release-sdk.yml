# The browser SDK's release: push a tag `sdk-vX.Y.Z` matching packages/browser-sdk/package.json, and
# this tests and builds it, shows exactly what would be published, and — once the repository
# variable SDK_PUBLISH is `true` — publishes it to npm (docs/changes/ready-to-deploy, T32).
#
# Published through npm's trusted publishing: npm trusts this workflow's OIDC identity, so no npm
# token exists to leak, and the package carries provenance (needs package.json's repository.url to
# name this repository). The repository is public and the package no longer `private`
# (2026-10-29); it publishes once npmjs.com names this workflow as its trusted publisher and the
# variable is set. Until then every run stops after the dry run.
name: Release SDK

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read

concurrency:
  group: release-sdk-${{ github.ref }}

jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/browser-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
          registry-url: "https://registry.npmjs.org"
      - name: The tag names the package's version
        run: |
          declared=$(node -p "require('./package.json').version")
          [ "sdk-v$declared" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::$GITHUB_REF_NAME does not match package.json's $declared"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Test, build and measure
        run: pnpm test
      - name: What would be published
        run: npm publish --dry-run
      - name: Publish
        if: ${{ vars.SDK_PUBLISH == 'true' }}
        run: npm publish --access public
