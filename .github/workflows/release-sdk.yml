# The browser SDK's release: push a tag `sdk-vX.Y.Z` matching packages/browser-sdk/package.json, and
# this tests and builds it, shows exactly what would be published, and — once the repository
# variable SDK_PUBLISH is `true` — **stages** it on npm (docs/changes/ready-to-deploy, T32;
# docs/operations/release.md).
#
# Staged, never published directly (founder, 2026-10-30): npm trusts this workflow's OIDC identity
# only to stage a version, which goes live when a maintainer approves it on npmjs.com with their
# second factor. A stolen workflow, or a poisoned dependency running inside it, can stage at most;
# nothing it stages reaches a customer's page unapproved. No npm token exists; the version carries
# provenance (package.json's repository.url names this repository, as npm requires).

name: Release SDK

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read

concurrency:
  group: release-sdk-${{ github.ref }}

jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/browser-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
          registry-url: "https://registry.npmjs.org"
      # `npm stage` arrived in npm 11.15.0; Node 26.12.0 ships 11.20.0.
      - name: npm can stage
        run: |
          version=$(npm --version)
          [ "$(printf '%s\n' 11.15.0 "$version" | sort -V | head -n 1)" = 11.15.0 ] \
            || { echo "::error::npm $version cannot stage; 11.15.0 or newer is needed"; exit 1; }
      - name: The tag names the package's version
        run: |
          declared=$(node -p "require('./package.json').version")
          [ "sdk-v$declared" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::$GITHUB_REF_NAME does not match package.json's $declared"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Test, build and measure
        run: pnpm test
      - name: What would be staged
        run: npm stage publish --dry-run
      - name: Stage for approval
        if: ${{ vars.SDK_PUBLISH == 'true' }}
        run: npm stage publish --access public --provenance
      - name: Approve it on npm
        if: ${{ vars.SDK_PUBLISH == 'true' }}
        run: |
          echo "::notice::Staged ${GITHUB_REF_NAME#sdk-v}. It goes live when a maintainer approves it at https://www.npmjs.com/package/@nexovue/browser-sdk (or: npm stage list, then npm stage approve <id>)."
