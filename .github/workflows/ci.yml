# The quality gate on GitHub: `just check`, the same command run before every commit, against the
# development stack's real stores, so the live suites run rather than skip
# (docs/changes/ready-to-deploy, T7). Actions are pinned by commit, as the repository requires.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `just check`, in three parts on three runners, each with its own stack: everything but the
  # Python tests, and the Python tests in two halves of equal test count (tools/test-shard). Run
  # whole, it took 28 to 37 minutes against its 45-minute step limit (2026-11-23).
  check-part:
    name: check (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: rest
          - part: python-1
            shard: 1
          - part: python-2
            shard: 2
    steps:
      # The runner ships toolkits nothing here uses; the stack, its images and the gate's data left
      # the disk 96% full (2026-10-28), so they go first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # The whole history: `buf breaking` compares the contracts with main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Make main available to buf breaking
        run: git rev-parse --verify --quiet main >/dev/null || git branch main origin/main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.6"
          enable-cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
          cache: pnpm
      # From PyPI through uv, pinned: setup-just pulls in a second action of its own, which the
      # repository's allowed-actions list (Step 0) does not name.
      - name: Install just
        run: |
          uv tool install rust-just==1.58.0
          uv tool dir --bin >> "$GITHUB_PATH"
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: "1.72.0"
          setup_only: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true

      - name: Install dependencies
        run: just setup

      # Known vulnerabilities in what production runs; before the stack, because it needs none of it.
      - name: just audit
        if: matrix.part == 'rest'
        run: just audit

      # The development stack, prepared by the same setup step a deployment runs.
      - name: Start the stores and services
        run: |
          docker compose version
          just stack

      # Below the job's 60 minutes: a run that hangs fails this step, so its log is kept and the
      # memory and service-log steps below run, instead of the job being cancelled with no log
      # (three runs on 2026-11-21 were). Together the parts are `just check`'s recipes.
      - name: just check, everything but the Python tests
        if: matrix.part == 'rest'
        timeout-minutes: 45
        run: just fmt-check lint test-go test-web contracts-check bundle-check
      - name: just check, one half of the Python tests
        if: matrix.part != 'rest'
        timeout-minutes: 45
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          read -ra files <<< "$(uv run python tools/test-shard/shard.py "$SHARD" 2)"
          [ "${#files[@]}" -gt 0 ] || { echo "the shard named no test files"; exit 1; }
          just test-py "${files[@]}"

      - name: Memory and disk the stack used
        if: always()
        run: |
          docker stats --no-stream --format '{{.Name}}\t{{.MemUsage}}' || true
          df -h / || true

      - name: Service logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yaml logs --tail 200

  # The required status check: it passes only when every part of `check` passed.
  check:
    if: always()
    needs: check-part
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part of check passed
        env:
          RESULT: ${{ needs.check-part.result }}
        run: test "$RESULT" = success

  # F3 plan T3.11: the AI role's fence on a really installed kit (AC42, AC46). Separate from
  # `check`: it builds both images and installs them, which `just check` must stay fast without.
  # Its tests carry the `insight_fence` marker and fail rather than skip without the install.
  insight-fence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Install just
        run: |
          uv tool install rust-just==1.58.0
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Install dependencies
        run: uv sync --all-packages
      - name: just insight-fence
        run: just insight-fence

  # F22 plan T8.3 (AC56): a full case with no AI configured and no `scheduler-insight`. Postgres
  # alone, prepared by the real setup step with no AI account made; the run is refused if an AI
  # setting or an AI container is present, then the suite runs a case through the API and the
  # scheduler's real worker. Separate from `check`, whose stack runs `scheduler-insight` idle.
  ai-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_DSN: postgresql+asyncpg://nexovue:nexovue_dev@localhost:15432/nexovue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.6"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Start Postgres alone
        run: docker compose -f deploy/compose/docker-compose.yaml up -d --wait postgres
      # No object store and no account passwords: setup migrates, and makes no AI account.
      - name: Prepare Postgres with no AI account
        run: uv run --package nexovue-api python -m nexovue_api.setup
      - name: Refuse an AI setting or an AI container
        run: |
          # The variables nexovue's AI half reads, by name: an unrelated AI_* is not one.
          if env | grep -E '^(AI_SECRET_KEY|AI_SECRET_PREVIOUS_KEYS|AI_PRIVATE_ENDPOINTS|DEV_AI_SECRET_KEY|POSTGRES_INSIGHT_PASSWORD)='; then
            echo "an AI setting is present; this job proves cases with AI off"; exit 1
          fi
          if docker ps --format '{{.Names}}' | grep -q 'insight'; then
            echo "scheduler-insight is running; this job proves cases without it"; exit 1
          fi
          if docker compose -f deploy/compose/docker-compose.yaml exec -T postgres \
              psql -U nexovue -d nexovue -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'nexovue_insight'" | grep -q 1; then
            echo "the AI account exists; setup was given its password"; exit 1
          fi
      - name: A full case with AI off
        # `-m ai_off` replaces the default `not ai_off`; selecting nothing exits 5 and fails the job.
        run: uv run pytest -p no:cacheprovider -m ai_off apps/api/tests/test_ai_off_cases_live.py
