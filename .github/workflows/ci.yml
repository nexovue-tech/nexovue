name: ci

# `just check` is the gate. This workflow installs the toolchains and then runs
# that one recipe, so CI cannot drift from what a developer runs before a commit.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded push is wasted work, but a main build is the record of main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: just check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `contracts-check` compares the proto tree against main, so the
          # history that holds main has to be here.
          fetch-depth: 0

      # `buf breaking --against '.git#branch=main'` names a *local* branch.
      # checkout leaves a detached HEAD on pull_request, where no local main
      # exists; on a push to main it already does, and re-fetching it would fail.
      - name: Make main resolvable as a local branch
        run: |
          git show-ref --verify --quiet refs/heads/main \
            || git fetch --no-tags origin +refs/heads/main:refs/heads/main

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: go.work.sum

      # install-only: `just lint-go` runs it, per module, exactly as it runs
      # locally. The action is here for the pinned version and its own cache.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-only: true

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # uv provisions the interpreter .python-version names; no setup-python.
          enable-cache: true

      # pnpm before setup-node: the node cache keys off the pnpm store.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.72.0
          github_token: ${{ github.token }}

      # The same recipe a developer runs once: go work sync, uv sync, pnpm install.
      - run: just setup

      # fmt-check · lint · test · contracts-check, unmodified.
      - run: just check
