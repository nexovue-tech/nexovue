name: images

# `just check` compiles nothing the way a deploy does. Adding tools/ modules to
# go.work broke `apps/receiver/Dockerfile` and `apps/workers/Dockerfile` — they
# copy three of the six go.mod files, so `go mod download all` cannot load the
# workspace — and it went unnoticed for a whole milestone because no gate ever
# built an image. This job builds every image the production compose target
# references, so the next such break fails the PR that causes it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_COMPOSE: deploy/compose/docker-compose.app.yaml

jobs:
  # The service list comes from the compose file rather than a literal here, so
  # a new deploy service is built without anyone remembering to add it.
  # `config` reports profiled services too, so they are filtered out by hand:
  # `insight` is a Phase 2 forward declaration whose directory does not exist.
  discover:
    name: discover buildable services
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      services: ${{ steps.compose.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read build targets from the production compose file
        id: compose
        run: |
          set -euo pipefail
          # --no-interpolate: this file deliberately gives credentials no
          # defaults, so plain `config` fails on the unset ones. Build paths are
          # literals and need no interpolation to read.
          services=$(docker compose -f "$APP_COMPOSE" config --no-interpolate --format json | jq -c '
            [ .services
              | to_entries[]
              | select(.value.build != null)
              | select(.value.profiles | length == 0)
              | { service: .key,
                  context: .value.build.context,
                  dockerfile: .value.build.dockerfile } ]
            | unique_by(.dockerfile)')
          if [ "$services" = "[]" ]; then
            echo "no buildable services found in $APP_COMPOSE" >&2
            exit 1
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "$services" | jq .

  build:
    name: build ${{ matrix.service }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # One broken Dockerfile should not hide a second one.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # `docker compose config` resolves both to absolute paths on the runner.
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Proving it builds is the point; nothing is published from a PR.
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          # Scoped per service so six builds do not evict each other.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
