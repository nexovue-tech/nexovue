# A release: push a tag `vX.Y.Z` (or `vX.Y.Z-rc.N`), and this checks the tagged commit passed CI, then
# builds both images (ADR-019) natively for amd64 and arm64, publishes them to GHCR as one
# multi-architecture tag, signs and attests them, builds the install kit and the two offline bundles,
# and opens a GitHub release carrying them, with generated notes (docs/changes/ready-to-deploy, T8,
# T15). Versions are tagged by hand (founder, 2026-10-28). Actions are pinned by commit, as the
# repository requires.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  REGISTRY: ghcr.io/nexovue-tech

jobs:
  # CI's own result for the tagged commit, before anything is built: a tag pushed beside its commit
  # started both workflows at once, and v0.1.0-rc.2 was published while that commit's CI was still
  # running (2026-10-28). Green: build. Still running: wait for it. Failed, or never run (a tag on a
  # commit that is not on main): stop, and nothing is published.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: read
    steps:
      - name: The tagged commit passed CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 140); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs | sort_by(.run_attempt) | last | [.status, .conclusion // "", .html_url] | @tsv')
            if [ -z "$run" ]; then
              echo "::error::No CI run exists for $GITHUB_SHA. Tag only a commit pushed to main, after its CI."
              exit 1
            fi
            IFS=$'\t' read -r status conclusion url <<< "$run"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed for $GITHUB_SHA: $url"
                exit 0
              fi
              echo "::error::CI for $GITHUB_SHA ended '$conclusion': $url. Nothing is built."
              exit 1
            fi
            echo "CI for $GITHUB_SHA is $status; waiting ($attempt)…"
            sleep 30
          done
          echo "::error::CI for $GITHUB_SHA did not finish within 70 minutes."
          exit 1

  build:
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [nexovue, nexovue-pipeline]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version and build time
        id: facts
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest only: nothing carries the version's tag until every architecture built.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/images/${{ matrix.image }}.Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ steps.facts.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.facts.outputs.created }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Keep the digest for the merge
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # A dot, not a hyphen: `nexovue-*` also matched `nexovue-pipeline-*`, so the first release
          # merged the pipeline's digests into the nexovue tag (v0.1.0-rc.1).
          name: digests.${{ matrix.image }}.${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    name: publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [nexovue, nexovue-pipeline]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests.${{ matrix.image }}.*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # X.Y.Z, X.Y (not for a release candidate), and the commit.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: One tag over both architectures
        working-directory: digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
      - name: The published digest
        id: published
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
      # Signed by digest, never by tag: a tag can be moved, a digest cannot.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
          DIGEST: ${{ steps.published.outputs.digest }}
      # GitHub stores attestations for public repositories only (or on a paid plan); while this one
      # is private, the image's own provenance and SBOM and the cosign signature stand alone.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true

  # The install kit, and an offline bundle per architecture holding every image the install runs
  # (deploy/release/kit.sh). Each file is signed with cosign's keyless signature, as the images are.
  kit:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      # The bundles hold every image uncompressed on the way to gzip; the runner's tools go first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The kit and the offline bundles
        run: deploy/release/kit.sh "${GITHUB_REF_NAME#v}" dist amd64 arm64
      # GitHub refuses a release file over 2 GiB; say so here rather than at the upload.
      - name: Every file fits a GitHub release
        run: |
          find dist -type f -size +1900M -print -exec false {} +
          ls -lh dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        working-directory: dist
        run: |
          for file in *.tar *.tar.gz; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
          sha256sum -- *.tar *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit
          path: dist/*
          retention-days: 1

  release:
    needs: [publish, kit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit
          path: dist
      # The runner's own GitHub CLI with this run's token; a tag with a hyphen is a pre-release.
      - name: GitHub release with generated notes and the kit
        run: |
          flags=(--generate-notes --title "nexovue $GITHUB_REF_NAME" --verify-tag)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}" dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
