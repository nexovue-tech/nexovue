version: v2

modules:
  - path: proto

# The envelope carries OTLP as opaque bytes and imports nothing. profiles.proto
# imports OTLP's common.v1 for attributes, so the masker applies to them unchanged
# (ADR-015) — from the BSR, never vendored, pinned by buf.lock. See the README.
deps:
  - buf.build/opentelemetry/opentelemetry

lint:
  use:
    - STANDARD

# FILE is the strictest category: it forbids anything that breaks a generated
# consumer, not merely anything that breaks the wire. Six programs read this message.
breaking:
  use:
    - FILE
