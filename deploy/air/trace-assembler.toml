# Live reload for the trace-assembler binary in the development stack.
# Kept under deploy/ with the dev image that runs it: the source tree is
# bind-mounted at /workspace, so this is deployment tooling, not service code.

root = "/workspace"
tmp_dir = "/tmp/air/trace-assembler"

[build]
cmd = "go build -o /tmp/air/trace-assembler/app ./apps/workers/cmd/trace-assembler"
entrypoint = "/tmp/air/trace-assembler/app"
# The monorepo holds three languages; watching all of it would rebuild Go on
# every CSS edit.
include_dir = ["apps/workers", "packages/contracts/gen/go"]
include_ext = ["go"]
exclude_regex = ["_test\\.go"]
# Editors write a file several times per save.
delay = 400
stop_on_error = true

[log]
main_only = true
