# Live reload for the demo-app binary in the development stack.
# Kept under deploy/ with the dev image that runs it: the source tree is
# bind-mounted at /workspace, so this is deployment tooling, not service code.

root = "/workspace"
tmp_dir = "/tmp/air/demo-app"

[build]
cmd = "go build -o /tmp/air/demo-app/app ./tools/demo-app"
entrypoint = "/tmp/air/demo-app/app"
# The monorepo holds three languages; watching all of it would rebuild Go on
# every CSS edit.
include_dir = ["tools/demo-app", "packages/contracts/gen/go"]
include_ext = ["go"]
exclude_regex = ["_test\\.go"]
# Editors write a file several times per save.
delay = 400
stop_on_error = true

[log]
main_only = true
