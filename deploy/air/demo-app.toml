# Live reload for the demo app. One binary; DEMO_ROLE picks the service.
root = "."
tmp_dir = "/cache/air/demo-app"

[build]
  cmd = "go build -o /cache/air/demo-app/demo-app ./tools/demo-app/cmd/demo-app"
  bin = "/cache/air/demo-app/demo-app"
  include_ext = ["go"]
  include_dir = ["tools/demo-app"]
  exclude_dir = ["apps", "packages", "docs", "deploy", "node_modules"]
  delay = 500
  stop_on_error = true
