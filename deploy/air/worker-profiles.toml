# Live reload for the profiles worker: the worker binary, running profile-ingest
# only (see WORKER_PIPELINES in deploy/compose/docker-compose.yaml). Its own
# tmp_dir, because two air processes building into one directory overwrite each
# other's binary mid-start.
root = "."
tmp_dir = "/cache/air/worker-profiles"

[build]
  cmd = "go build -o /cache/air/worker-profiles/worker ./apps/workers/cmd/worker"
  # Start the binary again when it exits, as the production restart policy does.
  # A shell loop rather than air's `rerun`: a rebuild during rerun's wait leaves
  # two restart loops, so two copies run; air kills this loop's whole group.
  full_bin = "while :; do /cache/air/worker-profiles/worker; sleep 5; done"
  include_ext = ["go"]
  include_dir = ["apps/workers", "packages/contracts"]
  exclude_dir = ["apps/api", "apps/web", "apps/scheduler", "docs", "deploy", "node_modules"]
  delay = 500
  stop_on_error = true
