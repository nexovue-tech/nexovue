# `promtool test rules deploy/monitoring/tests/nexovue_test.yml` (just lint-deploy): each alert
# fires on the failure it names and stays quiet on a healthy install.
rule_files:
  - ../rules/nexovue.yml

evaluation_interval: 1m

tests:
  - name: a stopped service is reported by its missing scrape
    interval: 1m
    input_series:
      - series: 'up{job="worker", instance="10.0.0.5:8081"}'
        values: "1 0 0 0 0"
      - series: 'up{job="api", instance="10.0.0.6:8000"}'
        values: "1 1 1 1 1"
    alert_rule_test:
      - eval_time: 2m
        alertname: NexovueServiceDown
        exp_alerts: []
      - eval_time: 4m
        alertname: NexovueServiceDown
        exp_alerts:
          - exp_labels: {severity: page, job: worker, instance: "10.0.0.5:8081"}
            exp_annotations:
              summary: "worker at 10.0.0.5:8081 is not answering /metrics"

  - name: two leading beats, or none, page; one does not
    interval: 1m
    input_series:
      - series: 'nexovue_scheduler_beat_leading{job="scheduler-beat", instance="a"}'
        values: "1 1 1 1 1 1"
      - series: 'nexovue_scheduler_beat_leading{job="scheduler-beat", instance="b"}'
        values: "0 0 1 1 1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: NexovueNoBeatLeading
        exp_alerts: []
      - eval_time: 5m
        alertname: NexovueNoBeatLeading
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "2 beats lead; exactly one must, or no check is scheduled"

  - name: a parked record raises a ticket
    interval: 1m
    input_series:
      - series: 'nexovue_worker_dead_letter_records{topic="spans-dlq"}'
        values: "0 0 0 1 1"
    alert_rule_test:
      - eval_time: 2m
        alertname: NexovueDeadLetters
        exp_alerts: []
      - eval_time: 4m
        alertname: NexovueDeadLetters
        exp_alerts:
          - exp_labels: {severity: ticket, topic: spans-dlq}
            exp_annotations:
              summary: "records were parked on spans-dlq (docs/operations/dead-letters.md)"

  - name: the receiver refusing more than one export in twenty
    interval: 1m
    input_series:
      - series: 'nexovue_receiver_requests_total{outcome="accepted"}'
        values: "0+90x30"
      - series: 'nexovue_receiver_requests_total{outcome="refused"}'
        values: "0+10x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: NexovueReceiverRefusing
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "the receiver refuses 10% of export requests"

  - name: the receiver refusing most exports because a dependency other than Kafka is down
    interval: 1m
    input_series:
      - series: 'nexovue_receiver_requests_total{outcome="accepted"}'
        values: "0+40x30"
      - series: 'nexovue_receiver_requests_total{outcome="refused"}'
        values: "0+60x30"
      - series: 'nexovue_receiver_events_total{reason="unavailable"}'
        values: "0+60x30"
    alert_rule_test:
      - eval_time: 3m
        alertname: NexovueReceiverDependencyUnavailable
        exp_alerts: []
      - eval_time: 10m
        alertname: NexovueReceiverDependencyUnavailable
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "the receiver refuses 60% of export requests because a dependency is down"

  - name: senders cancelling a few exports page nobody
    interval: 1m
    input_series:
      - series: 'nexovue_receiver_requests_total{outcome="accepted"}'
        values: "0+99x30"
      - series: 'nexovue_receiver_requests_total{outcome="refused"}'
        values: "0+1x30"
      - series: 'nexovue_receiver_events_total{reason="unavailable"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: NexovueReceiverDependencyUnavailable
        exp_alerts: []

  - name: spans far behind for ten minutes
    interval: 1m
    input_series:
      - series: 'nexovue_worker_consumer_lag_records{group="spans", topic="spans-raw"}'
        values: "2000 60000x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: NexovueSpansFallingBehind
        exp_alerts: []
      - eval_time: 15m
        alertname: NexovueSpansFallingBehind
        exp_alerts:
          - exp_labels: {severity: page, group: spans}
            exp_annotations:
              summary: "consumer group spans is 60000 spans behind"

  - name: API failures above one in a hundred
    interval: 1m
    input_series:
      - series: 'nexovue_api_requests_total{group="traces", status="2xx"}'
        values: "0+95x30"
      - series: 'nexovue_api_requests_total{group="traces", status="5xx"}'
        values: "0+5x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: NexovueApiErrors
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "5% of API requests fail"

  - name: an alert waiting five minutes to go out pages
    interval: 1m
    input_series:
      - series: 'nexovue_scheduler_oldest_alert_waiting_seconds{job="scheduler-beat"}'
        values: "0 400x12"
    alert_rule_test:
      - eval_time: 10m
        alertname: NexovueAlertsUndelivered
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "a customer's alert has waited 400s to be delivered"

  - name: a service with no container at all is missed, not merely down
    interval: 1m
    input_series:
      - series: 'up{job="receiver", instance="a"}'
        values: "1x5"
      - series: 'up{job="api", instance="b"}'
        values: "1x5"
      - series: 'up{job="scheduler-beat", instance="c"}'
        values: "1x5"
      - series: 'up{job="scheduler-light", instance="d"}'
        values: "1x5"
      - series: 'up{job="scheduler-deliveries", instance="e"}'
        values: "1x5"
      - series: 'up{job="worker", instance="f"}'
        values: "1 stale"
    alert_rule_test:
      - eval_time: 1m
        alertname: NexovueServiceMissing
        exp_alerts: []
      - eval_time: 5m
        alertname: NexovueServiceMissing
        exp_alerts:
          - exp_labels: {severity: page, job: worker}
            exp_annotations:
              summary: "no worker is running to be scraped"

  # Beat's leader counts the rows: the sweep that writes them runs in a worker's child process,
  # whose own metrics no scrape sees (found by the detection runbook's walk, 2026-11-01).
  - name: detection holding every project for nexovue's intake pages while its event is recent
    interval: 1m
    input_series:
      - series: 'nexovue_scheduler_detection_events_recent{job="scheduler-beat", instance="leader", kind="intake_guard"}'
        values: "0 0 0 1x15 0x5"
      - series: 'nexovue_scheduler_detection_events_recent{job="scheduler-beat", instance="leader", kind="hold_expired"}'
        values: "0x23"
      - series: 'nexovue_scheduler_detection_events_recent{job="scheduler-beat", instance="follower", kind="intake_guard"}'
        values: "0x23"
    alert_rule_test:
      - eval_time: 2m
        alertname: NexovueDetectionHeldByIntake
        exp_alerts: []
      - eval_time: 4m
        alertname: NexovueDetectionHeldByIntake
        exp_alerts:
          - exp_labels: {severity: page, kind: intake_guard}
            exp_annotations:
              summary: "detection recorded intake_guard: nexovue's own intake failed for every project (docs/operations/detection.md)"
      - eval_time: 22m
        alertname: NexovueDetectionHeldByIntake
        exp_alerts: []

  # The heartbeat: a stopped sweep settles nothing, so the minute it last settled ages, though no
  # project is counted behind and the owners' email, which the sweep sends, never goes.
  - name: detection stalled pages when the minute sweep stops, with no project behind
    interval: 1m
    input_series:
      - series: 'nexovue_scheduler_detection_settled_minute_age_seconds{job="scheduler-beat", instance="leader"}'
        values: "240+60x15"
      - series: 'nexovue_scheduler_detection_settled_minute_age_seconds{job="scheduler-beat", instance="follower"}'
        values: "0x15"
      - series: 'nexovue_scheduler_detection_projects_behind{job="scheduler-beat", instance="leader"}'
        values: "0x15"
    alert_rule_test:
      - eval_time: 6m
        alertname: NexovueDetectionStalled
        exp_alerts: []
      - eval_time: 9m
        alertname: NexovueDetectionStalled
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "the newest minute detection settled is 13m 0s old; nothing newer is judged (docs/operations/detection.md)"
      - eval_time: 9m
        alertname: NexovueProjectDetectionFailing
        exp_alerts: []

  - name: a sweep that has never settled a minute is stalled
    interval: 1m
    input_series:
      - series: 'nexovue_scheduler_detection_settled_minute_age_seconds{job="scheduler-beat", instance="leader"}'
        values: "+Inf+0x5"
    alert_rule_test:
      - eval_time: 3m
        alertname: NexovueDetectionStalled
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "the newest minute detection settled is +Inf old; nothing newer is judged (docs/operations/detection.md)"

  - name: detection settling on time stays quiet
    interval: 1m
    input_series:
      - series: 'nexovue_scheduler_detection_settled_minute_age_seconds{job="scheduler-beat", instance="leader"}'
        values: "200 260 230 290 250 210 270 240 300 220 280 240 200 260 230 290 250 210 270 240 300"
      - series: 'nexovue_scheduler_detection_projects_behind{job="scheduler-beat", instance="leader"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: NexovueDetectionStalled
        exp_alerts: []
      - eval_time: 20m
        alertname: NexovueProjectDetectionFailing
        exp_alerts: []

  - name: projects detection has not judged for three minutes page, naming none
    interval: 1m
    input_series:
      - series: 'nexovue_scheduler_detection_projects_behind{job="scheduler-beat", instance="leader"}'
        values: "0 0 2x10"
      - series: 'nexovue_scheduler_detection_projects_behind{job="scheduler-beat", instance="follower"}'
        values: "0x12"
      - series: 'nexovue_scheduler_detection_settled_minute_age_seconds{job="scheduler-beat", instance="leader"}'
        values: "240x12"
    alert_rule_test:
      - eval_time: 3m
        alertname: NexovueProjectDetectionFailing
        exp_alerts: []
      - eval_time: 5m
        alertname: NexovueProjectDetectionFailing
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "detection has completed no run in over 3 minutes for 2 projects; their owners are emailed at 15 (docs/operations/detection.md)"
      - eval_time: 5m
        alertname: NexovueDetectionStalled
        exp_alerts: []
