# DEVELOPMENT target — `just dev`.
#
# Infrastructure comes from compose.infra.yaml through `include:`. It is not
# `-f` layering on purpose: `-f` appends sequences, so the bind mounts below
# would leak into docker-compose.app.yaml and a "production replica" would be
# running the developer's working tree.
#
# Profiles (docs/delivery/dev-environment.md rule 2):
#   default  infrastructure + the services on the walking-skeleton path
#   doors    Celery probes and pollers, including the Playwright browser queue
#   tools    demo app and load generator
#
# Every service is capped per docs/delivery/dev-environment.md. Core total is
# ~10 GB inside a ~13 GB Docker VM allocation.

name: nexovue

include:
  - path: compose.infra.yaml

services:
  # Host ports live in a nexovue-specific 1xxxx block so the stack never fights
  # another project for 5432, 6379, 9000, 5173 or 8000. Container-side ports are
  # unchanged, so nothing inside the network knows or cares. Ollama sits at 21434
  # because a natively-installed Ollama already owns 11434.

  # ---------- infrastructure: developer conveniences only ----------
  # Ports are published here and nowhere else — the deployment targets keep the
  # data stores off the host entirely. The host side is a variable because these
  # are the well-known ports and another project on the same laptop may already
  # hold one; the container side never moves.
  kafka:
    ports:
      - "${KAFKA_HOST_PORT:-19092}:29092"

  clickhouse:
    ports:
      - "${CLICKHOUSE_HTTP_HOST_PORT:-18123}:8123"
      - "${CLICKHOUSE_NATIVE_HOST_PORT:-19000}:9000"

  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"

  redis:
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"

  seaweedfs:
    ports:
      - "${SEAWEEDFS_S3_HOST_PORT:-18333}:8333"
      - "${SEAWEEDFS_MASTER_HOST_PORT:-19333}:9333"

  # ---------- data plane (Go, rebuilt on save by air) ----------
  receiver:
    build:
      context: ../..
      dockerfile: deploy/docker/go-dev.Dockerfile
    command: air -c deploy/air/receiver.toml
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - go-cache:/cache
    # Variable names come from apps/receiver/internal/config, which is the
    # authority on what this service reads.
    environment:
      ENV: development
      LOG_LEVEL: debug
      LOG_FORMAT: console
      KAFKA_BROKERS: kafka:9092
      POSTGRES_DSN: ${DEV_POSTGRES_DSN:-postgresql://nexovue:nexovue_dev@postgres:5432/nexovue}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${RECEIVER_GRPC_HOST_PORT:-14317}:4317"
      - "${RECEIVER_HTTP_HOST_PORT:-14318}:4318"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      # First `go build` of the module has to compile the dependency tree.
      start_period: 180s
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Larger than the budget in dev-environment.md, which sizes the
          # running process. This container also hosts the Go compiler, and
          # every save recompiles inside it.
          memory: 768M

  # One worker process runs every pipeline. WORKER_PIPELINES narrows the set,
  # so the same image can be deployed several times with different selections
  # once load justifies separating them — see ADR 0050.
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/go-dev.Dockerfile
    command: air -c deploy/air/worker.toml
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - go-cache:/cache
    environment:
      ENV: development
      LOG_LEVEL: debug
      LOG_FORMAT: console
      KAFKA_BROKERS: kafka:9092
      CLICKHOUSE_DSN: ${DEV_CLICKHOUSE_DSN:-clickhouse://nexovue:nexovue_dev@clickhouse:9000/nexovue}
      WORKER_PIPELINES: all
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Trace assembly holds a trace-buffer window in memory; the other
          # pipelines stream through. Plus the compiler, which dev containers host.
          memory: 1G

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/python-dev.Dockerfile
    command: >-
      uv run --package nexovue-api
      uvicorn nexovue_api.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir apps/api/src
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - python-venv:/workspace/.venv
    # Variable names come from apps/api/src/nexovue_api/settings.py.
    environment: &api-env
      ENV: development
      LOG_LEVEL: debug
      LOG_FORMAT: console
      POSTGRES_DSN: ${DEV_POSTGRES_DSN_ASYNC:-postgresql+asyncpg://nexovue:nexovue_dev@postgres:5432/nexovue}
      # The API reads ClickHouse over HTTP but takes the same clickhouse:// DSN
      # shape the workers use, and derives the port from it.
      CLICKHOUSE_DSN: ${DEV_CLICKHOUSE_HTTP_DSN:-clickhouse://nexovue:nexovue_dev@clickhouse:8123/nexovue}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_HOST_PORT:-18000}:8000"
    healthcheck:
      # python:slim ships no curl or wget; urllib is always there.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz")
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 832 MB is the runtime budget; `uv sync` on first start needs more.
          memory: 1024M

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web-dev.Dockerfile
    command: pnpm --filter @nexovue/web dev --host 0.0.0.0 --port 5173
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - web-node-modules:/workspace/node_modules
    environment:
      # Vite runs inside this container, so the proxy target has to be the
      # compose service name. The code's default is localhost:18000, which is
      # right when you run `pnpm dev` on the host and wrong in here.
      NEXOVUE_API_ORIGIN: http://api:8000
    ports:
      - "${WEB_HOST_PORT:-15173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    deploy:
      resources:
        limits:
          # dev-environment.md budgets 0.1 GB for `web`. That fits the nginx
          # image in docker-compose.app.yaml, but not a Vite dev server, and
          # certainly not the `pnpm install` that precedes it.
          memory: 1024M

  # ---------- doors 2 and 4b ----------
  scheduler-beat:
    profiles: ["doors"]
    build:
      context: ../..
      dockerfile: deploy/docker/python-dev.Dockerfile
    command: >-
      uv run --package nexovue-scheduler
      watchmedo auto-restart --directory apps/scheduler/src --pattern '*.py' --recursive --
      celery -A nexovue_scheduler.celery_app beat --scheduler nexovue_scheduler.beat:PostgresScheduler
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - python-venv:/workspace/.venv
    environment: &scheduler-env
      ENV: development
      LOG_LEVEL: debug
      LOG_FORMAT: console
      POSTGRES_DSN: ${DEV_POSTGRES_DSN_ASYNC:-postgresql+asyncpg://nexovue:nexovue_dev@postgres:5432/nexovue}
      # Database 1 keeps probe queues out of the rate-limit counters on 0.
      REDIS_URL: redis://redis:6379/1
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  scheduler-light:
    profiles: ["doors"]
    build:
      context: ../..
      dockerfile: deploy/docker/python-dev.Dockerfile
    command: >-
      uv run --package nexovue-scheduler
      watchmedo auto-restart --directory apps/scheduler/src --pattern '*.py' --recursive --
      celery -A nexovue_scheduler.celery_app worker --queues light --concurrency 8 --loglevel info
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - python-venv:/workspace/.venv
    environment: *scheduler-env
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  scheduler-browser:
    profiles: ["doors"]
    build:
      context: ../..
      dockerfile: apps/scheduler/Dockerfile.browser
    command: >-
      celery -A nexovue_scheduler.celery_app worker
      --queues browser --concurrency 1 --loglevel info
    volumes:
      - ../../apps/scheduler/src:/app/src
    environment: *scheduler-env
    # Chromium's default 64 MB /dev/shm is the usual cause of crashes in Docker.
    shm_size: 1gb
    ipc: host
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M

  # ---------- tools ----------
  # The fake shop, as three services. They call each other over HTTP, so a trace
  # crosses real process boundaries and the waterfall has genuine depth.
  #
  # OTel is configured only by the standard OTEL_* variables — the same two lines
  # our onboarding asks a customer for. The key is the one `just seed` creates.
  demo-storefront:
    profiles: ["tools"]
    build: &demo-build
      context: ../..
      dockerfile: deploy/docker/go-dev.Dockerfile
    command: air -c deploy/air/demo-app.toml
    working_dir: /workspace
    volumes: &demo-volumes
      - ../..:/workspace
      - go-cache:/cache
    environment:
      <<: &demo-otel
        OTEL_EXPORTER_OTLP_ENDPOINT: http://receiver:4318
        OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
        OTEL_EXPORTER_OTLP_HEADERS: x-nexovue-key=${DEMO_API_KEY:-nvk_live_devlocaldevlocaldevloc}
      DEMO_ROLE: storefront
      DEMO_CHECKOUT_URL: http://demo-checkout:8090
      DEMO_TRAFFIC_RATE: ${DEMO_TRAFFIC_RATE:-2}
    ports:
      - "${DEMO_APP_HOST_PORT:-18090}:8090"
    depends_on:
      receiver:
        condition: service_healthy
    deploy: &demo-limits
      resources:
        limits:
          memory: 512M

  demo-checkout:
    profiles: ["tools"]
    build: *demo-build
    command: air -c deploy/air/demo-app.toml
    working_dir: /workspace
    volumes: *demo-volumes
    environment:
      <<: *demo-otel
      DEMO_ROLE: checkout
      DEMO_PAYMENTS_URL: http://demo-payments:8090
    ports:
      - "${DEMO_CHECKOUT_HOST_PORT:-18091}:8090"
    deploy: *demo-limits

  demo-payments:
    profiles: ["tools"]
    build: *demo-build
    command: air -c deploy/air/demo-app.toml
    working_dir: /workspace
    volumes: *demo-volumes
    environment:
      <<: *demo-otel
      DEMO_ROLE: payments
    ports:
      - "${DEMO_PAYMENTS_HOST_PORT:-18092}:8090"
    deploy: *demo-limits

  loadgen:
    profiles: ["tools"]
    build:
      context: ../..
      dockerfile: deploy/docker/go-dev.Dockerfile
    command: go run ./tools/loadgen
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - go-cache:/cache
    environment:
      TARGET_ENDPOINT: http://receiver:4318
    deploy:
      resources:
        limits:
          memory: 512M


  # ---------- intelligence (Phase 2, `insight` profile) ----------
  # Not part of `just dev`: apps/insight does not exist until F3/F6. Defined
  # here so the dev stack can grow into it without a compose redesign.
  insight:
    profiles: ["insight"]
    build:
      context: ../..
      dockerfile: deploy/docker/python-dev.Dockerfile
    command: >-
      uv run --package nexovue-insight
      watchmedo auto-restart --directory apps/insight/src --pattern '*.py' --recursive --
      python -m nexovue_insight
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - python-venv:/workspace/.venv
    environment:
      ENV: development
      LOG_LEVEL: debug
      LOG_FORMAT: console
      POSTGRES_DSN: ${DEV_POSTGRES_DSN_ASYNC:-postgresql+asyncpg://nexovue:nexovue_dev@postgres:5432/nexovue}
      CLICKHOUSE_DSN: ${DEV_CLICKHOUSE_HTTP_DSN:-clickhouse://nexovue:nexovue_dev@clickhouse:8123/nexovue}
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  # Only for developers who want a container rather than a native install.
  # On macOS prefer running Ollama natively: Docker has no Metal passthrough,
  # so this is CPU-only here, which is why LLM_BASE_URL above defaults to the
  # host rather than to this service.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.12.11
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-21434}:11434"
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY:-6G}

volumes:
  ollama-models:
  go-cache:
  python-venv:
  web-node-modules:
