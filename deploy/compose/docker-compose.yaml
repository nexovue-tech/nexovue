# DEVELOPMENT target — `just dev`.
#
# Infrastructure comes from compose.infra.yaml through `include:`. It is not
# `-f` layering on purpose: `-f` appends sequences, so the bind mounts below
# would leak into docker-compose.app.yaml and a "production replica" would be
# running the developer's working tree.
#
# Profiles:
#   default  infrastructure + the services on the walking-skeleton path
#   doors    the scheduler: beat, probes, pollers and alert delivery
#   tools    demo app and load generator
#
# Every service is capped to the laptop budget. Core total is ~10 GB inside a
# ~13 GB Docker VM allocation.

name: nexovue

# The stores' development adjustments (published ports) are a second file listed with the include:
# Compose refuses a service redefined by the file that includes it, except in its newest versions.
include:
  - path:
      - compose.infra.yaml
      - compose.infra.dev.yaml

services:
  # Host ports live in a nexovue-specific 1xxxx block so the stack never fights
  # another project for 5432, 6379, 9000, 5173 or 8000. Container-side ports are
  # unchanged, so nothing inside the network knows or cares. Ollama sits at 21434
  # because a natively-installed Ollama already owns 11434.

  # ---------- data plane (Go, rebuilt on save by air) ----------
  receiver:
    build:
      context: ../..
      dockerfile: deploy/docker/go-dev.Dockerfile
    command: air -c deploy/air/receiver.toml
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - go-cache:/cache
    # Variable names come from apps/receiver/internal/config, which is the
    # authority on what this service reads.
    environment:
      # Go's collector cannot see a cgroup limit — as of Go 1.26 the proposal to
      # derive this from the cgroup is still open — so without it the heap doubles
      # freely and the kernel kills the process first. Measured: the worker was
      # OOM-killed at 1017 MB RSS against this 1 GiB cap. ~85%, leaving the rest
      # for stacks and everything outside the heap.
      GOMEMLIMIT: 650MiB
      ENV: development
      LOG_LEVEL: debug
      LOG_FORMAT: console
      KAFKA_BROKERS: kafka:9092
      POSTGRES_DSN: ${DEV_POSTGRES_DSN:-postgresql://nexovue:nexovue_dev@postgres:5432/nexovue}
      # Go's runtime profiles on the admin listener, which is not published to
      # the host — reach them with `docker compose exec receiver wget -qO-
      # http://127.0.0.1:8081/debug/pprof/heap`. Off everywhere else: the
      # endpoints are unauthenticated. Without this the re-encode budget in
      # phase-1-plan.md §4 stays unmeasurable in dev as well as in production.
      RECEIVER_PPROF_ENABLED: "true"
    ports:
      - "${RECEIVER_GRPC_HOST_PORT:-14317}:4317"
      - "${RECEIVER_HTTP_HOST_PORT:-14318}:4318"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      # First `go build` of the module has to compile the dependency tree.
      start_period: 180s
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Larger than the budget in dev-environment.md, which sizes the
          # running process. This container also hosts the Go compiler, and
          # every save recompiles inside it.
          memory: 768M

  # One image, deployed twice: `worker` runs spans, logs and metrics, and
  # `WORKER_PIPELINES` chooses what a worker process runs; one process runs them
  # all here. It can be split again — profiles ran alone until 2026-09-20 — by
  # giving a second service the same image and a different list.
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/go-dev.Dockerfile
    command: air -c deploy/air/worker.toml
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - go-cache:/cache
    environment:
      # Go's collector cannot see a cgroup limit — as of Go 1.26 the proposal to
      # derive this from the cgroup is still open — so without it the heap doubles
      # freely and the kernel kills the process first. Measured: the worker was
      # OOM-killed at 1017 MB RSS against a 1 GiB cap. ~85% of the limit below,
      # leaving the rest for stacks and everything outside the heap.
      GOMEMLIMIT: 1300MiB
      ENV: development
      LOG_LEVEL: debug
      LOG_FORMAT: console
      KAFKA_BROKERS: kafka:9092
      CLICKHOUSE_DSN: ${DEV_CLICKHOUSE_DSN:-clickhouse://nexovue:nexovue_dev@clickhouse:9000/nexovue}
      # Read-only, and only for per-project masking and sampling rules. Without
      # it the worker runs on compiled-in defaults and says so at boot.
      POSTGRES_DSN: ${DEV_POSTGRES_DSN:-postgresql://nexovue:nexovue_dev@postgres:5432/nexovue}
      # Keys the pseudonyms a hashing masking rule produces. Fixed here so a
      # pseudonym survives a restart in development; every deployment target
      # supplies its own, and rotating it silently ends every correlation that
      # spans the change.
      WORKERS_MASKING_HASH_SECRET: ${WORKERS_MASKING_HASH_SECRET:-7b6H4ZIcduE9aYaTRdv2LKQeIKR3hYf5w4IDCAdevfI=}
      # Every pipeline, in one process (founder, 2026-09-20 —
      # `docs/changes/one-worker-again/`). Profiles ran in a service of their own
      # from 2026-09-19, after a flood from one organization OOM-killed this
      # worker and stopped spans with it; they share this budget again, which is
      # why the cap above carries what both used to have.
      WORKER_PIPELINES: all
      # Go's runtime profiles on the admin listener, which is not published to
      # the host — reach them with `docker compose exec worker wget -qO-
      # http://127.0.0.1:8081/debug/pprof/heap`. Off everywhere else: the
      # endpoints are unauthenticated.
      WORKERS_PPROF_ENABLED: "true"
    healthcheck:
      # /healthz — liveness. It now covers the pipeline as well as the process,
      # so a stopped consumer turns the container red; it deliberately does NOT
      # probe Kafka or ClickHouse, because a restart cannot fix a dependency
      # outage and would only crash-loop every worker on top of it.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    depends_on:
      # Masking and sampling rules come from Postgres the moment the worker starts;
      # without it every span is handled with the built-in defaults for the first
      # 30 seconds instead of the project's own rules.
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Trace assembly holds a trace-buffer window and profile ingest holds a
          # decoded payload; the other pipelines stream through. Plus the
          # compiler, which dev containers host. 1.5G is the two caps this
          # service was split into, put back together.
          memory: 1536M

  # Fills the Python environment the services share, once, before any of them starts. Started
  # together on an empty volume, five `uv run`s installed the same packages into it at once and
  # one met another's half-written files (CI, 2026-10-28). Afterwards each `uv run` finds nothing
  # to install. After a dependency changes: `docker compose up python-deps`, then restart.
  python-deps:
    build:
      context: ../..
      dockerfile: deploy/docker/python-dev.Dockerfile
    command: uv sync --all-packages --frozen
    working_dir: /workspace
    restart: "no"
    volumes:
      - ../..:/workspace
      - python-venv:/workspace/.venv

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/python-dev.Dockerfile
    # `--timeout-graceful-shutdown`: uvicorn otherwise waits for open client
    # connections for ever, so one held-open curl wedges every reload until the
    # container is restarted by hand. Ten seconds is long enough for a real
    # request to finish and short enough that a stray one costs nothing.
    command: >-
      uv run --package nexovue-api
      uvicorn nexovue_api.main:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir apps/api/src --timeout-graceful-shutdown 10
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - python-venv:/workspace/.venv
    # Variable names come from apps/api/src/nexovue_api/settings.py.
    environment: &api-env
      ENV: development
      LOG_LEVEL: debug
      LOG_FORMAT: console
      POSTGRES_DSN: ${DEV_POSTGRES_DSN_ASYNC:-postgresql+asyncpg://nexovue:nexovue_dev@postgres:5432/nexovue}
      # The API reads ClickHouse over HTTP but takes the same clickhouse:// DSN
      # shape the workers use, and derives the port from it.
      # Reads as the read-only account; the API holds no ClickHouse credential that writes.
      CLICKHOUSE_DSN: ${DEV_CLICKHOUSE_READER_DSN:-clickhouse://nexovue_reader:nexovue_reader_dev@clickhouse:8123/nexovue}
      # Source map bytes. The generic S3 API only — SeaweedFS here,
      # AWS S3 in deployment. The dev credentials are the ones in
      # deploy/seaweedfs/s3.json; the API creates the bucket at boot in
      # development only.
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: nexovue-dev
      S3_ACCESS_KEY_ID: nexovue_dev_access
      S3_SECRET_ACCESS_KEY: nexovue_dev_secret
      # Seals check secrets (ADR-010). A dev constant, like the passwords above:
      # it protects nothing outside this machine. The scheduler holds the same.
      CHECK_SECRET_KEY: ${DEV_CHECK_SECRET_KEY:-qPYHqC1y6hD0s6knf12GgLTcvJsKkPdzaDgvE8sAFA4=}
      CHECK_SECRET_PREVIOUS_KEYS: ${DEV_CHECK_SECRET_PREVIOUS_KEYS:-}
      # Seals second-factor secrets — customers' TOTP and staff's (F31). A dev
      # constant for the same reason; without it two-factor sign-in answers 503
      # in development, which is how customer TOTP went untried here until now.
      CREDENTIAL_ENCRYPTION_KEY: ${DEV_CREDENTIAL_ENCRYPTION_KEY:-1tru1EuwOqD39XZm1z-sb2mrRHEFmbD_vreXaw2YZE8=}
      CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS: ${DEV_CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS:-}
      PROBE_LOCATIONS: local
      # Where a browser lands: the **app**, never this API. Verification links,
      # password resets and the return from a payment all point at a screen,
      # which then calls the endpoint behind it.
      #
      # Built from the same `WEB_HOST_PORT` as the published port below, so the
      # two cannot disagree — a developer who moves the web port and forgets this
      # would get links to a port nothing is listening on. It is a dev constant
      # rather than something to put in `.env`, because in this stack the answer
      # is always "wherever `web` is".
      APP_BASE_URL: http://localhost:${WEB_HOST_PORT:-15173}
      # Development renders mail into the log instead of sending it.
      #
      # Not a convenience: signing up sends a verification message, so every
      # account a test creates spent one real message against a metered
      # allowance. Three signups reach this container per `just check`, which
      # made the gate a recurring charge on a quota no suite in it was about —
      # 80% of a month's allowance went that way in one working session.
      #
      # Set here rather than left to `.env` because the failure is silent and
      # cumulative: nothing tells you it is happening until the provider does.
      # This deliberately wins over an `EMAIL_PROVIDER` in `.env` (compose
      # applies `environment` over `env_file`), so the credentials that file
      # holds cannot be spent by a container nobody was watching. The real chain
      # is proved by `just test-billable`, which reads `.env` in the test process
      # and never goes through here.
      #
      # The log carries the rendered body, so a verification link is followed by
      # copying it out of `docker logs nexovue-api-1`.
      EMAIL_PROVIDER: console
      # One proxy sits in front of this API: the web container, which is how a
      # browser and the end-to-end suite reach it. Saying so lets the rate
      # limiter count the caller rather than the proxy — without it every
      # browser on this machine is one client, and the suite's four workers
      # share one signup allowance (`docs/changes/faster-gate/`). The API is
      # also published directly on 18000, where anything on this machine could
      # claim any address; that is a development convenience, and the deployment
      # targets set this from their own topology.
      TRUSTED_PROXY_COUNT: 1
      # nexovue's own operator (`docs/changes/super-admin-in-the-console/`). The
      # API seeds this `users` row at boot and re-hashes the password every time,
      # so rotating it is an edit here and a restart. Sign in on the ordinary
      # sign-in page; the platform area appears in the sidebar and asks for this
      # password again before it opens.
      #
      # A dev constant like the passwords above — it reaches nothing outside this
      # machine. In deployment it is a real secret, and leaving both blank (a
      # self-hosted install) seeds nobody.
      SUPER_ADMIN_EMAIL: operator@nexovue.test
      SUPER_ADMIN_PASSWORD: nexovue-dev-operator
      # **Open here, and said out loud.** The setting is closed by default now,
      # so every target states what it wants. Development and the e2e suite both
      # create tenants through the public endpoint the way a customer would —
      # `tools/e2e/tests/support/accounts.ts` and `test_tenant_isolation_live`
      # would have nothing to sign up with if this were inherited.
      SIGNUP_ENABLED: "true"
    # The developer's own third-party credentials — the payment gateway
    # (`PAYMENTS_DOMESTIC_*`) and the mail provider (`EMAIL_*`).
    #
    # **These are the only settings this file cannot supply itself.** Every value
    # above is a dev constant, because Postgres and SeaweedFS are containers
    # started here and their passwords mean nothing outside this machine. A
    # sandbox gateway account is not: it belongs to a person, so it lives in
    # their own `.env` and reaches the container from there.
    #
    # `required: false` because the stack must come up without one. Nothing on
    # the walking-skeleton path needs either credential, and a developer who has
    # not signed up for a gateway should not be blocked from running the product
    # — the billing screen says upgrading is unavailable, and the API answers 503
    # rather than 500 if a route that needs one is called.
    #
    # Read directly rather than through `${VAR}` substitution: compose resolves
    # those against the *project directory*, which is this folder rather than the
    # repository root, so a value in the root `.env` would silently expand to
    # nothing and the container would look configured while carrying blanks.
    env_file:
      - path: ../../.env
        required: false
    ports:
      - "${API_HOST_PORT:-18000}:8000"
    healthcheck:
      # python:slim ships no curl or wget; urllib is always there.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz")
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      python-deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      # The API creates its bucket at boot — `lifespan._open_object_store` calls
      # `ensure_bucket()` — so this is a hard dependency and was missing until
      # 2026-09-08. Without it a cold start races: the API comes up first, the
      # bucket call fails, and startup aborts with "could not prepare the bucket"
      # while SeaweedFS turns healthy seconds later. It only bites after a
      # `down-hard`, which is why it survived so long.
      seaweedfs:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 832 MB is the runtime budget; `uv sync` on first start needs more.
          memory: 1024M
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web-dev.Dockerfile
    # Install first, into the volumes below, rather than trusting pnpm's own check, which looks only
    # at the root node_modules and leaves a fresh package volume empty. Quick when nothing changed.
    command: >-
      sh -c "pnpm install --frozen-lockfile && pnpm --filter @nexovue/web dev --host 0.0.0.0 --port 5173"
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - web-node-modules:/workspace/node_modules
      # Each workspace package's own node_modules too: the container's `pnpm install` writes them
      # as root, and in the shared tree a Linux host's user then cannot write there — CI's web
      # tests failed EACCES on apps/web/node_modules (2026-10-28). Docker Desktop hides it.
      - web-app-node-modules:/workspace/apps/web/node_modules
      - web-ui-node-modules:/workspace/packages/ui/node_modules
      - web-sdk-node-modules:/workspace/packages/browser-sdk/node_modules
      - web-e2e-node-modules:/workspace/tools/e2e/node_modules
    environment:
      # Vite runs inside this container, so the proxy target has to be the
      # compose service name. The code's default is localhost:18000, which is
      # right when you run `pnpm dev` on the host and wrong in here.
      NEXOVUE_API_ORIGIN: http://api:8000
    ports:
      - "${WEB_HOST_PORT:-15173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    deploy:
      resources:
        limits:
          # dev-environment.md budgets 0.1 GB for `web`. That fits static files,
          # but not a Vite dev server, and certainly not the `pnpm install` that
          # precedes it.
          memory: 1024M

  # ---------- doors 2 and 4b ----------
  scheduler-beat:
    build:
      context: ../..
      dockerfile: deploy/docker/python-dev.Dockerfile
    command: >-
      uv run --package nexovue-scheduler
      watchmedo auto-restart --directory apps/scheduler/src --pattern '*.py' --recursive --
      python -m nexovue_scheduler beat
    # The loop's pulse (readiness blocker 7), through the mounted virtualenv.
    healthcheck:
      test: ["CMD", "/workspace/.venv/bin/python", "-m", "nexovue_scheduler", "health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - python-venv:/workspace/.venv
    environment: &scheduler-env
      ENV: development
      LOG_LEVEL: debug
      LOG_FORMAT: console
      POSTGRES_DSN: ${DEV_POSTGRES_DSN_ASYNC:-postgresql+asyncpg://nexovue:nexovue_dev@postgres:5432/nexovue}
      KAFKA_BROKERS: kafka:9092
      # The envelope bindings are generated output, not an installed package,
      # so every Python service that speaks the envelope adds them itself.
      PYTHONPATH: /workspace/packages/contracts/gen/python
      # Lets a probe reach a private address, which is where `just otel-demo up`
      # publishes the demo storefront — a Docker host is private by construction,
      # so without this a check against it is created and then never contacted.
      #
      # It is not sufficient on its own: the setting also requires ENV to be
      # development, so a staging deployment that inherited this line still
      # refuses. And it does not open loopback or link-local at any setting; see
      # `probes.addresses.may_connect_to`, which is where that line is drawn.
      ALLOW_PRIVATE_PROBE_TARGETS: "true"
      # The same key the API seals check secrets with, to open them at run time.
      CHECK_SECRET_KEY: ${DEV_CHECK_SECRET_KEY:-qPYHqC1y6hD0s6knf12GgLTcvJsKkPdzaDgvE8sAFA4=}
      CHECK_SECRET_PREVIOUS_KEYS: ${DEV_CHECK_SECRET_PREVIOUS_KEYS:-}
      # This worker is the one probe location a dev stack has.
      PROBER_REGION: local
      PROBE_LOCATIONS: local
      # The files checks send, read from the API's object store.
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: nexovue-dev
      S3_ACCESS_KEY_ID: nexovue_dev_access
      S3_SECRET_ACCESS_KEY: nexovue_dev_secret
      # Alert email (F21) renders into the log, as the API's account mail does and
      # for the API's reason: a test that trips a check must not spend a real
      # message. The alert, link and all, is read with `docker logs`.
      EMAIL_PROVIDER: console
      # Where an alert's link lands: the app, built from the same port as `web`.
      APP_BASE_URL: http://localhost:${WEB_HOST_PORT:-15173}
    depends_on:
      python-deps:
        condition: service_completed_successfully
      seaweedfs:
        # Files a check sends, and the objects its sweep deletes, live here. A
        # dependant that starts before the S3 gateway answers meets a refused
        # connection on its first object.
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      # Two, deliberately. One beat is a single point of failure, and the thing
      # it decides is when every customer's checks run — losing it stops all
      # monitoring with nothing to say so. They contend for one Postgres advisory
      # lock and only the holder schedules, so this does not double every check;
      # see nexovue_scheduler.leader.
      replicas: 2
      resources:
        limits:
          memory: 256M

  scheduler-light:
    build:
      context: ../..
      dockerfile: deploy/docker/python-dev.Dockerfile
    # The development host by name: Docker Desktop provides host.docker.internal on its own, plain
    # Docker on Linux (CI's runner) only when asked. Probes, deliveries and the model reach it here.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >-
      uv run --package nexovue-scheduler
      watchmedo auto-restart --directory apps/scheduler/src --pattern '*.py' --recursive --
      python -m nexovue_scheduler worker --concurrency 8
    # The loop's pulse (readiness blocker 7), through the mounted virtualenv.
    healthcheck:
      test: ["CMD", "/workspace/.venv/bin/python", "-m", "nexovue_scheduler", "health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - python-venv:/workspace/.venv
    environment:
      <<: *scheduler-env
      # The service alert rules read the telemetry store (F21, ADR-012). This worker
      # alone runs those sweeps, so it alone is handed the store.
      # Reads only: the read-only account.
      CLICKHOUSE_DSN: ${DEV_CLICKHOUSE_READER_DSN:-clickhouse://nexovue_reader:nexovue_reader_dev@clickhouse:8123/nexovue}
      # The nightly erasure of deleted organizations (ADR-014) runs on this
      # worker, as the account that can only read and delete (users.d/eraser.xml).
      CLICKHOUSE_ERASER_DSN: ${DEV_CLICKHOUSE_ERASER_DSN:-clickhouse://nexovue_eraser:nexovue_eraser_dev@clickhouse:8123/nexovue}
    depends_on:
      python-deps:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      seaweedfs:
        # Files a check sends, and the objects its sweep deletes, live here. A
        # dependant that starts before the S3 gateway answers meets a refused
        # connection on its first object.
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Eight child processes, each a full interpreter holding librdkafka,
          # libcurl and protobuf. At 256M -- the figure from before this service
          # had any C extensions -- the children were OOM-killed at startup and
          # the queue never drained.
          memory: 768M

  # F21. Delivers alerts — email, Slack, Teams, Discord, PagerDuty, webhooks —
  # from the outbox, and nothing else: a receiver that takes its full ten seconds
  # holds one of these slots, never a probe's (plan Q1). `scheduler-light`
  # excludes this queue for the same reason.
  scheduler-deliveries:
    build:
      context: ../..
      dockerfile: deploy/docker/python-dev.Dockerfile
    # The development host by name: Docker Desktop provides host.docker.internal on its own, plain
    # Docker on Linux (CI's runner) only when asked. Probes, deliveries and the model reach it here.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >-
      uv run --package nexovue-scheduler
      watchmedo auto-restart --directory apps/scheduler/src --pattern '*.py' --recursive --
      python -m nexovue_scheduler worker --queues deliveries --concurrency 4
    # The loop's pulse (readiness blocker 7), through the mounted virtualenv.
    healthcheck:
      test: ["CMD", "/workspace/.venv/bin/python", "-m", "nexovue_scheduler", "health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - python-venv:/workspace/.venv
    environment:
      <<: *scheduler-env
      # The one switch for real alert email in development: `just alert-email real`
      # sets these from the root `.env` for this worker alone and restarts it;
      # `just alert-email log`, or any `just dev`, puts it back to the log. They are
      # read from the shell, not from `.env` — compose resolves `${...}` against this
      # folder, not the repository root — so a value left in `.env` cannot turn real
      # mail on by itself, and a test that trips a check never spends a real message.
      # Only this worker sends alert mail and Send test; the API's account mail stays
      # in its log.
      EMAIL_PROVIDER: ${NEXOVUE_ALERT_EMAIL_PROVIDER:-console}
      EMAIL_API_KEY: ${NEXOVUE_ALERT_EMAIL_API_KEY:-}
      EMAIL_SENDING_DOMAIN: ${NEXOVUE_ALERT_EMAIL_SENDING_DOMAIN:-}
      EMAIL_FROM_ADDRESS: ${NEXOVUE_ALERT_EMAIL_FROM_ADDRESS:-}
      EMAIL_REPLY_TO: ${NEXOVUE_ALERT_EMAIL_REPLY_TO:-}
    depends_on:
      python-deps:
        condition: service_completed_successfully
      # The outbox and the job queue are both in Postgres.
      postgres:
        condition: service_healthy
      seaweedfs:
        # Named by the shared scheduler environment, so waited for rather than
        # listed as a reasoned exception; it is up long before anything is due.
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  # ---------- tools ----------
  # The hand-written demo shop is gone. It was three services we controlled, and
  # being tidy was exactly its problem: it never produced the messy polyglot
  # telemetry a real customer sends, so it hid defects the OpenTelemetry Demo
  # found in minutes — a log record that stopped ingest for every tenant, five
  # services with three blank promoted columns, a queue edge kind that had never
  # once been derived.
  #
  # `just otel-demo up` is the traffic source now: 18 services, ~10 languages,
  # pointed at our own receiver. See tools/otel-demo/.
  #
  # A `loadgen` service sat here behind a `tools` profile until 2026-09-06 and
  # had never sent a span: it set TARGET_ENDPOINT, which tools/loadgen does not
  # read, so it fell back to localhost:14318 — its own container — and refused
  # every export against itself while exiting 0. The generator is not gone;
  # `just load` runs it on the host, where that default is the receiver's
  # published port. It measures budgets, which is a thing you invoke, not a
  # thing you leave running.

  # ---------- intelligence (Phase 2, `insight` profile) ----------
  # Not part of `just dev`: apps/insight does not exist until F3/F6. Defined
  # here so the dev stack can grow into it without a compose redesign.
  insight:
    profiles: ["insight"]
    build:
      context: ../..
      dockerfile: deploy/docker/python-dev.Dockerfile
    # The development host by name: Docker Desktop provides host.docker.internal on its own, plain
    # Docker on Linux (CI's runner) only when asked. Probes, deliveries and the model reach it here.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >-
      uv run --package nexovue-insight
      watchmedo auto-restart --directory apps/insight/src --pattern '*.py' --recursive --
      python -m nexovue_insight
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - python-venv:/workspace/.venv
    environment:
      ENV: development
      LOG_LEVEL: debug
      LOG_FORMAT: console
      POSTGRES_DSN: ${DEV_POSTGRES_DSN_ASYNC:-postgresql+asyncpg://nexovue:nexovue_dev@postgres:5432/nexovue}
      CLICKHOUSE_DSN: ${DEV_CLICKHOUSE_HTTP_DSN:-clickhouse://nexovue:nexovue_dev@clickhouse:8123/nexovue}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      python-deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  # Only for developers who want a container rather than a native install.
  # On macOS prefer running Ollama natively: Docker has no Metal passthrough,
  # so this is CPU-only here, which is why LLM_BASE_URL above defaults to the
  # host rather than to this service.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.12.11
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-21434}:11434"
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY:-6G}

volumes:
  ollama-models:
  go-cache:
  python-venv:
  web-node-modules:
  web-app-node-modules:
  web-ui-node-modules:
  web-sdk-node-modules:
  web-e2e-node-modules:
