# The stores for the hosted layout (docker-compose.app.yaml): what compose.infra.yaml defines, plus
# a restart policy and credentials that must be set. Listed beside it in that file's `include`.

x-service-defaults: &service-defaults
  restart: unless-stopped

services:
  # ---------- infrastructure: no published ports ----------
  # The infrastructure module carries no restart policy, because development
  # wants a crashed container to stay down and be looked at. These three are
  # redeclared for the policy alone; the rest of their definition is inherited.
  kafka:
    <<: *service-defaults

  seaweedfs:
    <<: *service-defaults

  clickhouse:
    <<: *service-defaults
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?set CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?set CLICKHOUSE_READER_PASSWORD}
      CLICKHOUSE_ERASER_PASSWORD: ${CLICKHOUSE_ERASER_PASSWORD:?set CLICKHOUSE_ERASER_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"

  postgres:
    <<: *service-defaults
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
