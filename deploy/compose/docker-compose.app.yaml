# PRODUCTION REPLICA — `just dev-app`.
#
# Same infrastructure as development, services from their production images:
# no bind mounts, no reloaders, no published database ports. Its job is to fail
# here rather than in deployment when something only worked because the source
# tree was mounted.
#
# One way in: the Caddy edge, on the two names below, with TLS and the security
# headers — the same Caddyfile the on-prem file uses. On a laptop the names are
# `app.localhost` and `ingest.localhost`, which Caddy certifies from its own
# local authority. Settings: `deploy/compose/.env.example`.
#
# It runs under its own project name, so its volumes never touch the dev data.
#
# Credentials are redeclared with the `:?` required form. The infrastructure
# module carries development defaults, and inheriting one here would be silent.

name: nexovue-app

# Production restarts on failure and after a host reboot; onprem already says so
# on every service. A replica that does not is not replicating the thing it
# exists to catch problems in.
x-service-defaults: &service-defaults
  restart: unless-stopped

# The scheduler's own check (readiness blocker 7): its loop's pulse, not the
# process — a beat whose loop has hung stays up while every check stops.
x-scheduler-healthcheck: &scheduler-healthcheck
  test: ["CMD", "python", "-m", "nexovue_scheduler", "health"]
  interval: 15s
  timeout: 5s
  retries: 4
  start_period: 30s

# The two images (ADR-019), built here from the repository; a deployment pulls them by version
# instead. The role is the command each service gives.
x-nexovue-image: &nexovue-image
  build:
    context: ../..
    dockerfile: deploy/images/nexovue.Dockerfile
    args:
      VERSION: ${NEXOVUE_VERSION:-dev}
      REVISION: ${GIT_SHA:-unknown}
  image: ${NEXOVUE_REGISTRY:-ghcr.io/nexovue-tech}/nexovue:${NEXOVUE_VERSION:-dev}

x-pipeline-image: &pipeline-image
  build:
    context: ../..
    dockerfile: deploy/images/nexovue-pipeline.Dockerfile
    args:
      VERSION: ${NEXOVUE_VERSION:-dev}
      REVISION: ${GIT_SHA:-unknown}
  image: ${NEXOVUE_REGISTRY:-ghcr.io/nexovue-tech}/nexovue-pipeline:${NEXOVUE_VERSION:-dev}

# Every service waits for the setup step: a service started against an old schema or a missing
# topic fails its first queries (readiness blocker 5).
x-after-setup: &after-setup
  setup:
    condition: service_completed_successfully
  setup-pipeline:
    condition: service_completed_successfully

# The stores' adjustments for this target are a second file listed with the include: Compose refuses
# a service redefined by the file that includes it, except in its newest versions.
include:
  - path:
      - compose.infra.yaml
      - compose.infra.hosted.yaml

x-data-plane-env: &data-plane-env
  # What both Go services read. Each adds its own: the worker its ClickHouse
  # address. Merge keys cannot remove a
  # variable, so nothing either service ignores belongs here.
  ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json
  KAFKA_BROKERS: kafka:9092
  POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

x-control-plane-env: &control-plane-env
  # What the API and the scheduler both read. The API adds ClickHouse, the
  # scheduler adds Kafka; neither reads the other's, so neither is here.
  ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json
  POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  S3_ENDPOINT: http://seaweedfs:8333
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  # Seals check secrets in the API and opens them in the probe workers
  # (ADR-010). Demanded: an install without it cannot run any check that
  # uses a secret, and would only find out at the first run.
  CHECK_SECRET_KEY: ${CHECK_SECRET_KEY:?set CHECK_SECRET_KEY}
  # Keys that sealed before the current one, comma-separated; they only open.
  # Set during a rotation and emptied after `keys reseal` (docs/operations/key-rotation.md).
  CHECK_SECRET_PREVIOUS_KEYS: ${CHECK_SECRET_PREVIOUS_KEYS:-}
  # Run now dispatches to the probe workers through their broker (ADR-011).
  # Every probe location this deployment has, and the one this container is.
  PROBE_LOCATIONS: ${PROBE_LOCATIONS:-local}
  PROBER_REGION: ${PROBER_REGION:-local}
  # Where a browser lands after following a verification link, a password
  # reset, a payment or an alert. The edge's app name, never the ingest one,
  # and built from it so the two cannot disagree.
  APP_BASE_URL: https://${NEXOVUE_APP_HOST:?set NEXOVUE_APP_HOST}
  # Third-party credentials, passed through rather than demanded.
  #
  # `:-` and not `:?` on purpose, unlike every variable above: an install
  # that charges nobody needs no gateway, and one that sends no mail needs no
  # provider. `Settings.domestic_payments` and `Settings.email` read an unset
  # or blank value as "not configured" and hand back None, so the screens
  # still serve and only the routes that need a credential refuse — by
  # variable name, which is what `PaymentsNotConfiguredError` is for.
  #
  # An empty string is the same as absent to both, so a deployment that sets
  # three of the four gets None rather than a half-built client that fails at
  # its first signature check.
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
  EMAIL_API_KEY: ${EMAIL_API_KEY:-}
  EMAIL_SENDING_DOMAIN: ${EMAIL_SENDING_DOMAIN:-}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  PAYMENTS_DOMESTIC_PROVIDER: ${PAYMENTS_DOMESTIC_PROVIDER:-razorpay}
  PAYMENTS_DOMESTIC_APP_ID: ${PAYMENTS_DOMESTIC_APP_ID:-}
  PAYMENTS_DOMESTIC_SECRET_KEY: ${PAYMENTS_DOMESTIC_SECRET_KEY:-}
  PAYMENTS_DOMESTIC_WEBHOOK_SECRET: ${PAYMENTS_DOMESTIC_WEBHOOK_SECRET:-}
  PAYMENTS_DOMESTIC_CURRENCIES: ${PAYMENTS_DOMESTIC_CURRENCIES:-}
  PAYMENTS_DOMESTIC_BASE_URL: ${PAYMENTS_DOMESTIC_BASE_URL:-}

services:
  # ---------- the setup step: runs to completion before anything else ----------
  # Postgres to the newest migration and the object store's bucket (nexovue_api.setup).
  setup:
    <<: *nexovue-image
    command: ["setup"]
    restart: "no"
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # ClickHouse to the newest migration and the Kafka topics (apps/workers/cmd/setup). Postgres
  # holds the lock that keeps two of these apart.
  setup-pipeline:
    <<: *pipeline-image
    command: ["/setup"]
    restart: "no"
    environment:
      CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:9000/${CLICKHOUSE_DB}
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ---------- the edge ----------
  # The only service with a published port.
  proxy:
    <<: *service-defaults
    image: caddy:2.11.4-alpine
    # Caddy's admin API answers on loopback only, and the image has wget.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"
    environment:
      NEXOVUE_APP_HOST: ${NEXOVUE_APP_HOST:?set NEXOVUE_APP_HOST}
      NEXOVUE_INGEST_HOST: ${NEXOVUE_INGEST_HOST:?set NEXOVUE_INGEST_HOST}
      NEXOVUE_TLS_EMAIL: ${NEXOVUE_TLS_EMAIL:?set NEXOVUE_TLS_EMAIL}
      # Where Razorpay's checkout loads its scripts, opens its frame and reports
      # to; the console's content-security policy allows these and nothing else
      # foreign. Read from a test checkout through this edge (2026-10-11), not
      # from documentation, which lists none: checkout.js, its frame on api,
      # a risk script from cdn and tracking calls to lumberjack.
      NEXOVUE_CHECKOUT_ORIGINS: https://checkout.razorpay.com https://api.razorpay.com https://cdn.razorpay.com https://lumberjack.razorpay.com
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - web-assets:/srv/web:ro
    depends_on:
      api:
        condition: service_started
      receiver:
        condition: service_started
      web-assets-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M

  # The console is files the edge serves (ADR-019 point 3); this copies them out of the
  # nexovue image into the edge's volume, replacing the last release's, and exits.
  web-assets-init:
    <<: *nexovue-image
    command: ["web-assets", "/assets"]
    # Root for this one copy: a new volume belongs to root, and nothing here faces anyone.
    user: "0"
    restart: on-failure
    volumes:
      - web-assets:/assets

  # ---------- data plane ----------
  receiver:
    <<: [*service-defaults, *pipeline-image]
    command: ["/receiver"]
    healthcheck:
      test: ["CMD", "/receiver", "-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      <<: *data-plane-env
      # Go's collector cannot see a cgroup limit — as of Go 1.26 the proposal to
      # derive one from the cgroup is still open — so without this the heap
      # doubles freely and the kernel kills the process first. Measured: the dev
      # worker was OOM-killed at 1017 MB RSS against a 1 GiB cap. ~85% of this
      # service's 512M, leaving the rest for stacks and everything off-heap.
      GOMEMLIMIT: 435MiB
      # How many receivers share the traffic; each enforces its share of the
      # ingest limit. One setting for both, so they cannot drift apart.
      RECEIVER_INSTANCES: ${RECEIVER_INSTANCES:-1}
    depends_on:
      <<: *after-setup
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: ${RECEIVER_INSTANCES:-1}
      resources:
        limits:
          memory: 512M

  # One image, deployed once, running every pipeline (`WORKER_PIPELINES` chooses).
  # Deploying it twice with two lists is how it splits — profiles ran alone from
  # 2026-09-19 to 2026-09-20 — and a split service would need a memory limit of
  # its own, and this one's reduced to match.
  worker:
    <<: [*service-defaults, *pipeline-image]
    command: ["/worker"]
    healthcheck:
      test: ["CMD", "/worker", "-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      # Overrides the data-plane default below, because this service has its own
      # memory limit. Keep it at roughly 85% of WORKER_MEMORY: the two are one
      # setting in two places, and raising the limit without raising this leaves
      # the extra memory unusable.
      GOMEMLIMIT: ${WORKER_GOMEMLIMIT:-1088MiB}
      <<: *data-plane-env
      CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:9000/${CLICKHOUSE_DB}
      # Every pipeline, in one process (founder, 2026-09-20 —
      # `docs/changes/one-worker-again/`). They share one memory cap, which is why
      # the limit below carries what the two services it replaces carried: a
      # profile flood that exhausts it stops spans with it, as it did in September.
      WORKER_PIPELINES: all
      # Required rather than optional: the worker treats an absent secret as
      # "hashing rules unavailable" and boots anyway, so a missing value here
      # would disable pseudonymisation without anything going red.
      WORKERS_MASKING_HASH_SECRET: ${WORKERS_MASKING_HASH_SECRET:?set WORKERS_MASKING_HASH_SECRET}
    depends_on:
      # Masking and sampling rules come from Postgres the moment the worker starts;
      # without it every span is handled with the built-in defaults for the first
      # 30 seconds instead of the project's own rules.
      <<: *after-setup
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 768M for spans, logs and metrics plus 512M for profiles, in one
          # process now. Raising it means raising GOMEMLIMIT above with it.
          memory: ${WORKER_MEMORY:-1280M}


  api:
    <<: [*service-defaults, *nexovue-image]
    command: ["api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      <<: *control-plane-env
      # Seals two-factor secrets (readiness blocker 17): without it nobody on
      # this install can enable two-factor sign-in, and production refuses to start.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
      CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS: ${CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS:-}
      # Reads as the read-only account; the API holds no ClickHouse credential that writes.
      CLICKHOUSE_DSN: clickhouse://nexovue_reader:${CLICKHOUSE_READER_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
      # What signup hands a customer to export to: the edge's ingest name.
      OTLP_ENDPOINT: https://${NEXOVUE_INGEST_HOST:?set NEXOVUE_INGEST_HOST}
      # The edge is the one hop in front of the API, so the caller is the last
      # X-Forwarded-For entry. At 0 every customer is the edge's address and all
      # of them share one login throttle (readiness blocker 16). A load balancer
      # in front of the edge adds one.
      TRUSTED_PROXY_COUNT: "1"
      # How many API processes share the traffic; each enforces its share of the
      # in-memory limits. One setting for both, so they cannot drift apart.
      API_INSTANCES: ${API_INSTANCES:-1}
      # nexovue's cloud onboards customers after they pay (ADR-008, D10).
      SIGNUP_ENABLED: "${SIGNUP_ENABLED:-false}"
      # The API's own public hostname (F36). The MCP server answers only on the
      # hosts it is told about; unset, it falls back to the console's host and
      # localhost, which is right here and wrong behind two real names.
      API_PUBLIC_URL: "${API_PUBLIC_URL:-}"
      # nexovue's own operator, seeded at boot from these two
      # (`docs/changes/super-admin-in-the-console/`). `:-` rather than `:?`: an
      # install with nobody to administer it seeds nobody, and this replica has
      # to come up without them. The password is read when the operator is made;
      # after that it changes in the console (docs/operations/first-accounts.md).
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:-}"
      # The customer's own first account. Left empty here on purpose: this is the
      # hosted replica, where customers arrive through signup and an organization
      # created at boot would belong to nobody. It is the self-hosted file below
      # that fills these in.
      FIRST_ORGANIZATION_NAME: "${FIRST_ORGANIZATION_NAME:-}"
      FIRST_OWNER_EMAIL: "${FIRST_OWNER_EMAIL:-}"
      FIRST_OWNER_PASSWORD: "${FIRST_OWNER_PASSWORD:-}"
    depends_on:
      <<: *after-setup
      seaweedfs:
        # Files a check sends, and the objects its sweep deletes, live here. A
        # dependant that starts before the S3 gateway answers meets a refused
        # connection on its first object.
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      replicas: ${API_INSTANCES:-1}
      resources:
        limits:
          memory: 832M

  # ---------- doors 2 and 4b ----------
  scheduler-beat:
    <<: [*service-defaults, *nexovue-image]
    command: ["scheduler-beat"]
    healthcheck: *scheduler-healthcheck
    environment:
      <<: *control-plane-env
      KAFKA_BROKERS: kafka:9092
    depends_on:
      <<: *after-setup
      seaweedfs:
        # Files a check sends, and the objects its sweep deletes, live here. A
        # dependant that starts before the S3 gateway answers meets a refused
        # connection on its first object.
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  scheduler-light:
    <<: [*service-defaults, *nexovue-image]
    command: ["scheduler-light"]
    healthcheck: *scheduler-healthcheck
    environment:
      <<: *control-plane-env
      KAFKA_BROKERS: kafka:9092
      # The service alert rules read the telemetry store (F21, ADR-012); this
      # worker alone runs those sweeps, as the read-only account.
      CLICKHOUSE_DSN: clickhouse://nexovue_reader:${CLICKHOUSE_READER_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
      # The nightly erasure of deleted organizations (ADR-014) runs on this
      # worker, as the account that can only read and delete (users.d/eraser.xml).
      CLICKHOUSE_ERASER_DSN: clickhouse://nexovue_eraser:${CLICKHOUSE_ERASER_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
    depends_on:
      <<: *after-setup
      clickhouse:
        condition: service_healthy
      # Kafka carries every check result and Postgres holds this worker's job queue.
      # Starting before either loses the first results after three delivery attempts.
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seaweedfs:
        # Files a check sends, and the objects its sweep deletes, live here. A
        # dependant that starts before the S3 gateway answers meets a refused
        # connection on its first object.
        condition: service_healthy
      scheduler-beat:
        condition: service_started
    deploy:
      resources:
        limits:
          # What dev measured it needs: 256M OOM-killed its child processes at startup
          # and the queue never drained (docker-compose.yaml, scheduler-light).
          memory: 768M

  # F21. Delivers alerts — email, Slack, Teams, Discord, PagerDuty, webhooks —
  # from the outbox, and nothing else: a receiver that takes its full ten seconds
  # holds one of these slots, never a probe's (plan Q1). `scheduler-light`
  # excludes this queue for the same reason.
  scheduler-deliveries:
    <<: [*service-defaults, *nexovue-image]
    command: ["scheduler-deliveries"]
    healthcheck: *scheduler-healthcheck
    environment:
      <<: *control-plane-env
      KAFKA_BROKERS: kafka:9092
    depends_on:
      <<: *after-setup
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      scheduler-beat:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  caddy-data:
  caddy-config:
  web-assets:
