# PRODUCTION REPLICA — `just dev-app`.
#
# Same infrastructure as development, services from their production images:
# no bind mounts, no reloaders, no published database ports. Its job is to fail
# here rather than in deployment when something only worked because the source
# tree was mounted.
#
# It runs under its own project name, so its volumes never touch the dev data.
#
# Credentials are redeclared with the `:?` required form. The infrastructure
# module carries development defaults, and inheriting one here would be silent.

name: nexovue-app

# Production restarts on failure and after a host reboot; onprem already says so
# on every service. A replica that does not is not replicating the thing it
# exists to catch problems in.
x-service-defaults: &service-defaults
  restart: unless-stopped

include:
  - path: compose.infra.yaml

x-data-plane-env: &data-plane-env
  # What both Go services read. Each adds its own: the worker its ClickHouse
  # address. Merge keys cannot remove a
  # variable, so nothing either service ignores belongs here.
  ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json
  KAFKA_BROKERS: kafka:9092
  POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

x-control-plane-env: &control-plane-env
  # What the API and the scheduler both read. The API adds ClickHouse, the
  # scheduler adds Kafka; neither reads the other's, so neither is here.
  ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json
  POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  S3_ENDPOINT: http://seaweedfs:8333
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  # Seals check secrets in the API and opens them in the probe workers
  # (ADR-010). Demanded: an install without it cannot run any check that
  # uses a secret, and would only find out at the first run.
  CHECK_SECRET_KEY: ${CHECK_SECRET_KEY:?set CHECK_SECRET_KEY}
  # Run now dispatches to the probe workers through their broker (ADR-011).
  # Every probe location this deployment has, and the one this container is.
  PROBE_LOCATIONS: ${PROBE_LOCATIONS:-local}
  PROBER_REGION: ${PROBER_REGION:-local}
  # Where a browser lands after following a verification link, a password
  # reset or a payment. The app hostname, never the ingest one.
  # Demanded rather than defaulted: there is no sensible guess for a
  # deployment's own hostname, and a wrong one sends customers nowhere.
  APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
  # Third-party credentials, passed through rather than demanded.
  #
  # `:-` and not `:?` on purpose, unlike every variable above: an install
  # that charges nobody needs no gateway, and one that sends no mail needs no
  # provider. `Settings.domestic_payments` and `Settings.email` read an unset
  # or blank value as "not configured" and hand back None, so the screens
  # still serve and only the routes that need a credential refuse — by
  # variable name, which is what `PaymentsNotConfiguredError` is for.
  #
  # An empty string is the same as absent to both, so a deployment that sets
  # three of the four gets None rather than a half-built client that fails at
  # its first signature check.
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
  EMAIL_API_KEY: ${EMAIL_API_KEY:-}
  EMAIL_SENDING_DOMAIN: ${EMAIL_SENDING_DOMAIN:-}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
  PAYMENTS_DOMESTIC_PROVIDER: ${PAYMENTS_DOMESTIC_PROVIDER:-razorpay}
  PAYMENTS_DOMESTIC_APP_ID: ${PAYMENTS_DOMESTIC_APP_ID:-}
  PAYMENTS_DOMESTIC_SECRET_KEY: ${PAYMENTS_DOMESTIC_SECRET_KEY:-}
  PAYMENTS_DOMESTIC_ENV: ${PAYMENTS_DOMESTIC_ENV:-sandbox}
  PAYMENTS_DOMESTIC_WEBHOOK_SECRET: ${PAYMENTS_DOMESTIC_WEBHOOK_SECRET:-}
  PAYMENTS_DOMESTIC_CURRENCIES: ${PAYMENTS_DOMESTIC_CURRENCIES:-}
  PAYMENTS_DOMESTIC_BASE_URL: ${PAYMENTS_DOMESTIC_BASE_URL:-}

services:
  # ---------- infrastructure: no published ports ----------
  # The infrastructure module carries no restart policy, because development
  # wants a crashed container to stay down and be looked at. These three are
  # redeclared for the policy alone; the rest of their definition is inherited.
  kafka:
    <<: *service-defaults

  seaweedfs:
    <<: *service-defaults

  clickhouse:
    <<: *service-defaults
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?set CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?set CLICKHOUSE_READER_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"

  postgres:
    <<: *service-defaults
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  # ---------- data plane ----------
  receiver:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: apps/receiver/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: nexovue/receiver:${NEXOVUE_VERSION:-dev}
    healthcheck:
      test: ["CMD", "/receiver", "-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      <<: *data-plane-env
      # Go's collector cannot see a cgroup limit — as of Go 1.26 the proposal to
      # derive one from the cgroup is still open — so without this the heap
      # doubles freely and the kernel kills the process first. Measured: the dev
      # worker was OOM-killed at 1017 MB RSS against a 1 GiB cap. ~85% of this
      # service's 512M, leaving the rest for stacks and everything off-heap.
      GOMEMLIMIT: 435MiB
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # One image, deployed once, running every pipeline (`WORKER_PIPELINES` chooses).
  # Deploying it twice with two lists is how it splits — profiles ran alone from
  # 2026-09-19 to 2026-09-20 — and a split service would need a memory limit of
  # its own, and this one's reduced to match.
  worker:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: apps/workers/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: nexovue/worker:${NEXOVUE_VERSION:-dev}
    healthcheck:
      test: ["CMD", "/worker", "-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      # Overrides the data-plane default below, because this service has its own
      # memory limit. Keep it at roughly 85% of WORKER_MEMORY: the two are one
      # setting in two places, and raising the limit without raising this leaves
      # the extra memory unusable.
      GOMEMLIMIT: ${WORKER_GOMEMLIMIT:-1088MiB}
      <<: *data-plane-env
      CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:9000/${CLICKHOUSE_DB}
      # Every pipeline, in one process (founder, 2026-09-20 —
      # `docs/changes/one-worker-again/`). They share one memory cap, which is why
      # the limit below carries what the two services it replaces carried: a
      # profile flood that exhausts it stops spans with it, as it did in September.
      WORKER_PIPELINES: all
      # Required rather than optional: the worker treats an absent secret as
      # "hashing rules unavailable" and boots anyway, so a missing value here
      # would disable pseudonymisation without anything going red.
      WORKERS_MASKING_HASH_SECRET: ${WORKERS_MASKING_HASH_SECRET:?set WORKERS_MASKING_HASH_SECRET}
    depends_on:
      # Masking and sampling rules come from Postgres the moment the worker starts;
      # without it every span is handled with the built-in defaults for the first
      # 30 seconds instead of the project's own rules.
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 768M for spans, logs and metrics plus 512M for profiles, in one
          # process now. Raising it means raising GOMEMLIMIT above with it.
          memory: ${WORKER_MEMORY:-1280M}


  api:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: nexovue/api:${NEXOVUE_VERSION:-dev}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      <<: *control-plane-env
      # Reads as the read-only account; erasure alone holds the writer (docs/changes/clickhouse-protects-itself).
      CLICKHOUSE_DSN: clickhouse://nexovue_reader:${CLICKHOUSE_READER_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
      CLICKHOUSE_WRITER_DSN: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
      # nexovue's cloud onboards customers after they pay (ADR-008, D10). A
      # self-hosted install uses the on-prem file, where signup stays open.
      SIGNUP_ENABLED: "${SIGNUP_ENABLED:-false}"
      # The API's own public hostname (F36). The MCP server answers only on the
      # hosts it is told about; unset, it falls back to the console's host and
      # localhost, which is right here and wrong behind two real names.
      API_PUBLIC_URL: "${API_PUBLIC_URL:-}"
      # nexovue's own operator, seeded at boot from these two
      # (`docs/changes/super-admin-in-the-console/`). `:-` rather than `:?`: an
      # install with nobody to administer it seeds nobody, and this replica has
      # to come up without them. Rotation is an edit and a restart.
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:-}"
      # The customer's own first account. Left empty here on purpose: this is the
      # hosted replica, where customers arrive through signup and an organization
      # created at boot would belong to nobody. It is the self-hosted file below
      # that fills these in.
      FIRST_ORGANIZATION_NAME: "${FIRST_ORGANIZATION_NAME:-}"
      FIRST_OWNER_EMAIL: "${FIRST_OWNER_EMAIL:-}"
      FIRST_OWNER_PASSWORD: "${FIRST_OWNER_PASSWORD:-}"
    ports:
      - "8000:8000"
    depends_on:
      seaweedfs:
        # Files a check sends, and the objects its sweep deletes, live here. A
        # dependant that starts before the S3 gateway answers meets a refused
        # connection on its first object.
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 832M
  web:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: nexovue/web:${NEXOVUE_VERSION:-dev}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------- doors 2 and 4b ----------
  scheduler-beat:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: apps/scheduler/Dockerfile
    image: nexovue/scheduler:${NEXOVUE_VERSION:-dev}
    command: python -m nexovue_scheduler beat
    environment:
      <<: *control-plane-env
      KAFKA_BROKERS: kafka:9092
    depends_on:
      seaweedfs:
        # Files a check sends, and the objects its sweep deletes, live here. A
        # dependant that starts before the S3 gateway answers meets a refused
        # connection on its first object.
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  scheduler-light:
    <<: *service-defaults
    image: nexovue/scheduler:${NEXOVUE_VERSION:-dev}
    command: python -m nexovue_scheduler worker --concurrency 8
    environment:
      <<: *control-plane-env
      KAFKA_BROKERS: kafka:9092
      # The service alert rules read the telemetry store (F21, ADR-012). This worker
      # alone runs those sweeps. TODO(hosting): a read-only ClickHouse user; the
      # API's account is used until the deployment provisions one.
      # Reads only: the read-only account.
      CLICKHOUSE_DSN: clickhouse://nexovue_reader:${CLICKHOUSE_READER_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
    depends_on:
      clickhouse:
        condition: service_healthy
      # Kafka carries every check result and Postgres holds this worker's job queue.
      # Starting before either loses the first results after three delivery attempts.
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      seaweedfs:
        # Files a check sends, and the objects its sweep deletes, live here. A
        # dependant that starts before the S3 gateway answers meets a refused
        # connection on its first object.
        condition: service_healthy
      scheduler-beat:
        condition: service_started
    deploy:
      resources:
        limits:
          # What dev measured it needs: 256M OOM-killed its child processes at startup
          # and the queue never drained (docker-compose.yaml, scheduler-light).
          memory: 768M

  # F21. Delivers alerts — email, Slack, Teams, Discord, PagerDuty, webhooks —
  # from the outbox, and nothing else: a receiver that takes its full ten seconds
  # holds one of these slots, never a probe's (plan Q1). `scheduler-light`
  # excludes this queue for the same reason.
  scheduler-deliveries:
    <<: *service-defaults
    image: nexovue/scheduler:${NEXOVUE_VERSION:-dev}
    command: python -m nexovue_scheduler worker --queues deliveries --concurrency 4
    environment:
      <<: *control-plane-env
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      scheduler-beat:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 384M

  # ---------- intelligence (Phase 2) ----------
  # Anomaly detection, cross-signal correlation and the LLM call that turns a
  # detection into a plain-language finding. One service because these are
  # sequential stages of one flow, at findings-per-hour volumes rather than
  # spans-per-second — INSIGHT_PIPELINES splits them if that stops being true.
  #
  # TODO(phase-2): apps/insight does not exist yet. This describes the shape so
  #   the deployment target is complete; it cannot build until F3/F6 land.
  #
  # Behind a profile because `just dev-app` builds what it starts: in the default
  # set, the missing build context fails the whole recipe before anything runs.
  insight:
    profiles: ["insight"]
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: apps/insight/Dockerfile
    image: nexovue/insight:${NEXOVUE_VERSION:-dev}
    environment:
      <<: *control-plane-env
      # apps/insight does not exist yet, so which of these it reads is undecided.
      # Kept as it was until the service is written (F3, F6).
      CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
      KAFKA_BROKERS: kafka:9092
      INSIGHT_PIPELINES: ${INSIGHT_PIPELINES:-detect,correlate,summarise}
      # Points at the self-hosted model by default; set this to a hosted
      # provider and the ollama container below becomes unnecessary.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
    depends_on:
      seaweedfs:
        # Files a check sends, and the objects its sweep deletes, live here. A
        # dependant that starts before the S3 gateway answers meets a refused
        # connection on its first object.
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  # Self-hosted inference, only needed while LLM_BASE_URL points here.
  #
  # NOTE: on macOS this is CPU-only — Docker has no Metal passthrough — so run
  #   Ollama natively there and point LLM_BASE_URL at the host instead.
  ollama:
    # Same profile as insight: its only consumer, and nothing else dials it.
    profiles: ["insight"]
    <<: *service-defaults
    image: ollama/ollama:0.12.11
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY:-8G}

volumes:
  ollama-models:
