# ON-PREMISE deployment — SKELETON, NOT YET RUNNABLE.
#
# The shape is settled; the facts are not. Every unknown is marked TODO and
# nothing is guessed. Do not deploy this file until each TODO is answered.
#
# What differs from the other two targets:
#   - services come from a registry by immutable tag, never from a build context
#   - restart: unless-stopped on everything, so a host reboot restores the stack
#   - log rotation on everything, so a chatty service cannot fill the disk
#   - one TLS edge (Caddy); no other container publishes a port
#
# Caddy over Traefik at the edge because it needs no access to the Docker
# socket — a proxy that can drive the daemon is a poor thing to expose — and
# the service list here is fixed, so label-based discovery buys nothing.
#
# Usage: docker compose -f docker-compose.onprem.yaml --env-file /etc/nexovue/onprem.env up -d

name: nexovue

# TODO(registry): the pull path for nexovue images is not decided.
#   Options discussed nowhere yet: GHCR under nexovue-tech, a self-hosted
#   registry on the same host, or images side-loaded with `docker load`.
x-image-base: &image-base ${NEXOVUE_REGISTRY:?set NEXOVUE_REGISTRY}/nexovue

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

# The scheduler's own check (readiness blocker 7): its loop's pulse, not the
# process — a beat whose loop has hung stays up while every check stops.
x-scheduler-healthcheck: &scheduler-healthcheck
  test: ["CMD", "python", "-m", "nexovue_scheduler", "health"]
  interval: 15s
  timeout: 5s
  retries: 4
  start_period: 30s

include:
  - path: compose.infra.yaml

x-data-plane-env: &data-plane-env
  # What both Go services read. Each adds its own: the worker its ClickHouse
  # address. Merge keys cannot remove a
  # variable, so nothing either service ignores belongs here.
  ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json
  KAFKA_BROKERS: kafka:9092
  POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

x-control-plane-env: &control-plane-env
  # What the API and the scheduler both read. The API adds ClickHouse, the
  # scheduler adds Kafka; neither reads the other's, so neither is here.
  ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json
  POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  # Object storage: AWS S3, or the SeaweedFS service above for an
  # air-gapped install. Generic S3 API only. Holds source map
  # bytes today and the cold tier when it is built. The bucket must exist —
  # outside development the API does not create its own.
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  CHECK_SECRET_KEY: ${CHECK_SECRET_KEY:?set CHECK_SECRET_KEY}
  # Keys that sealed before the current one, comma-separated; they only open.
  # Set during a rotation and emptied after `keys reseal` (docs/operations/key-rotation.md).
  CHECK_SECRET_PREVIOUS_KEYS: ${CHECK_SECRET_PREVIOUS_KEYS:-}
  PROBE_LOCATIONS: local
  PROBER_REGION: local
  # Where every emailed link lands — verification, password reset, and an
  # alert's evidence (F21). The edge's app name, and built from it so the two
  # cannot disagree.
  APP_BASE_URL: https://${NEXOVUE_APP_HOST:?set NEXOVUE_APP_HOST}
  # The mail provider, passed through rather than demanded, as in the replica:
  # an install without one still serves every screen, and each email path says
  # which variable is missing. An air-gapped install has no provider to reach.
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
  EMAIL_API_KEY: ${EMAIL_API_KEY:-}
  EMAIL_SENDING_DOMAIN: ${EMAIL_SENDING_DOMAIN:-}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
  EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}

services:
  # ---------- infrastructure ----------
  # TODO(sizing): every limit below is the laptop budget. Server specs are
  #   unknown, so ClickHouse and Kafka are certainly undersized here. Resize
  #   against the real host and re-measure the latency budgets there.
  kafka:
    <<: *service-defaults
    environment:
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:?set KAFKA_HEAP_OPTS}

  clickhouse:
    <<: *service-defaults
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:?set CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?set CLICKHOUSE_READER_PASSWORD}
      CLICKHOUSE_ERASER_PASSWORD: ${CLICKHOUSE_ERASER_PASSWORD:?set CLICKHOUSE_ERASER_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"

  postgres:
    <<: *service-defaults
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}

  seaweedfs:
    # TODO(cold tier): the deployment decision is AWS S3, not SeaweedFS
    #   (decisions log, 2026-08-26). Keep this service only for an air-gapped
    #   install; otherwise delete it and point S3_ENDPOINT at S3.
    <<: *service-defaults

  # ---------- TLS edge ----------
  proxy:
    <<: *service-defaults
    image: caddy:2.11.4-alpine
    # Caddy's admin API answers on loopback only, and the image has wget.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Two names, not one: a session cookie scoped to a parent domain reaches
      # every child, so one name would deliver it on every browser-door beacon.
      # Caddy obtains a certificate for each.
      NEXOVUE_APP_HOST: ${NEXOVUE_APP_HOST:?set NEXOVUE_APP_HOST}
      NEXOVUE_INGEST_HOST: ${NEXOVUE_INGEST_HOST:?set NEXOVUE_INGEST_HOST}
      NEXOVUE_TLS_EMAIL: ${NEXOVUE_TLS_EMAIL:?set NEXOVUE_TLS_EMAIL}
      # No payment processor: a self-hosted install takes no payments, so the
      # console's content-security policy allows no checkout origin.
      NEXOVUE_CHECKOUT_ORIGINS: ""
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # The console's built files, which the edge serves itself (ADR-019 point 3).
      - web-assets:/srv/web:ro
    depends_on:
      api:
        condition: service_started
      receiver:
        condition: service_started
      web-assets-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------- data plane ----------
  # No published ports: the proxy is the only way in.
  receiver:
    <<: *service-defaults
    image: *image-base
    healthcheck:
      test: ["CMD", "/receiver", "-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # TODO(images): compose cannot append to a YAML anchor, so each service
    #   needs its full "<registry>/nexovue/<name>:<tag>" written out once the
    #   registry path above is decided. The anchor documents the base only.
    environment:
      <<: *data-plane-env
      # How many receivers share the traffic; each enforces its share of the
      # ingest limit. One setting for both, so they cannot drift apart.
      RECEIVER_INSTANCES: ${RECEIVER_INSTANCES:-1}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: ${RECEIVER_INSTANCES:-1}

  # One image, deployed once, running every pipeline (`WORKER_PIPELINES` chooses).
  # Deploying it twice with two lists is how it splits — profiles ran alone from
  # 2026-09-19 to 2026-09-20 — and a split service would need a memory limit of
  # its own, and this one's reduced to match.
  worker:
    <<: *service-defaults
    image: *image-base
    healthcheck:
      test: ["CMD", "/worker", "-health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      # Go's collector cannot see a cgroup limit, so without this the heap grows
      # until the kernel kills the process. ~85% of the limit below; the two are
      # one setting in two places, and this file was missing its half entirely
      # (`docs/changes/one-worker-again/`).
      GOMEMLIMIT: ${WORKER_GOMEMLIMIT:-1088MiB}
      # The worker was the one service missing this merge, so it had no broker
      # or store address at all — it could not have reached either.
      <<: *data-plane-env
      CLICKHOUSE_DSN: clickhouse://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:9000/${CLICKHOUSE_DB}
      # Every pipeline, in one process (founder, 2026-09-20 —
      # `docs/changes/one-worker-again/`). They share one memory cap, which is why
      # the limit below carries what the two services it replaces carried: a
      # profile flood that exhausts it stops spans with it, as it did in September.
      WORKER_PIPELINES: all
      # Required rather than optional: the worker treats an absent secret as
      # "hashing rules unavailable" and boots anyway, so a missing value here
      # would disable pseudonymisation without anything going red.
      WORKERS_MASKING_HASH_SECRET: ${WORKERS_MASKING_HASH_SECRET:?set WORKERS_MASKING_HASH_SECRET}
    depends_on:
      # The pipelines consume and write the moment the worker starts.
      # Masking and sampling rules come from Postgres the moment the worker starts;
      # without it every span is handled with the built-in defaults for the first
      # 30 seconds instead of the project's own rules.
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 768M for spans, logs and metrics plus 512M for profiles, in one
          # process now. Raising it means raising GOMEMLIMIT with it.
          memory: ${WORKER_MEMORY:-1280M}


  api:
    <<: *service-defaults
    image: *image-base
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      <<: *control-plane-env
      # Seals two-factor secrets (readiness blocker 17): without it nobody on
      # this install can enable two-factor sign-in, and production refuses to start.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY}
      CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS: ${CREDENTIAL_ENCRYPTION_PREVIOUS_KEYS:-}
      # Reads as the read-only account; the API holds no ClickHouse credential that writes.
      CLICKHOUSE_DSN: clickhouse://nexovue_reader:${CLICKHOUSE_READER_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
      # What signup hands a customer to export to: the edge's ingest name.
      OTLP_ENDPOINT: https://${NEXOVUE_INGEST_HOST:?set NEXOVUE_INGEST_HOST}
      # Caddy is the one hop in front of the API, so the caller is the last
      # X-Forwarded-For entry. At 0 the direct peer — Caddy, for everybody — is
      # every caller, and ten failed logins a minute lock out the whole install.
      TRUSTED_PROXY_COUNT: "1"
      # How many API processes share the traffic; each enforces its share of the
      # in-memory limits. One setting for both, so they cannot drift apart.
      API_INSTANCES: ${API_INSTANCES:-1}
      # **The way in.** This install has nobody to invite its first person, so
      # the first organization and its owner are created at boot from these.
      # Demanded rather than passed through: an install that starts with no
      # account has no way to reach its own console, and after the stack is up
      # is a worse time to learn that than start-up.
      #
      # Here rather than in `control-plane-env`, because the API is the only
      # process that seeds anything — the schedulers share that block and would
      # otherwise each hold a password they never read.
      #
      # Read once. Change the password in the console afterwards; a later restart
      # will not reset it, and both can be removed from the environment once the
      # first sign-in has happened. See `docs/operations/first-accounts.md`.
      FIRST_ORGANIZATION_NAME: ${FIRST_ORGANIZATION_NAME:-My organization}
      FIRST_OWNER_EMAIL: ${FIRST_OWNER_EMAIL:?set FIRST_OWNER_EMAIL — the account you will sign in as}
      FIRST_OWNER_PASSWORD: ${FIRST_OWNER_PASSWORD:?set FIRST_OWNER_PASSWORD — at least 8 characters}
      # **Closed.** The owner above is this install's way in, so public signup is
      # not needed — and left open it means a stranger who finds the page creates
      # an organization inside somebody else's deployment and sends telemetry at
      # their expense. Teammates arrive by invitation from the owner.
      #
      # Overridable, because an install that wants to be a small multi-tenant
      # service of its own is a legitimate thing to want; it just is not the
      # default anybody should get without asking.
      SIGNUP_ENABLED: "${SIGNUP_ENABLED:-false}"
      # No super admin on a self-hosted install: there is no nexovue inside it to
      # administer it, and the platform surface stays unreachable.
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      replicas: ${API_INSTANCES:-1}

  # The web app is static files, so the proxy serves them directly rather than
  # running a container whose only job is to hand back bytes that never change
  # between deploys. This copies them out of the image into the proxy's volume
  # at every deploy, and exits.
  web-assets-init:
    image: ${NEXOVUE_REGISTRY:?set NEXOVUE_REGISTRY}/web:${NEXOVUE_VERSION:?set NEXOVUE_VERSION}
    command: ["sh", "-c", "cp -r /srv/web/. /assets/"]
    restart: on-failure
    volumes:
      - web-assets:/assets

  scheduler-beat:
    <<: *service-defaults
    image: *image-base
    command: python -m nexovue_scheduler beat
    healthcheck: *scheduler-healthcheck
    environment:
      <<: *control-plane-env
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  scheduler-light:
    <<: *service-defaults
    image: *image-base
    command: python -m nexovue_scheduler worker --concurrency 8
    healthcheck: *scheduler-healthcheck
    environment:
      <<: *control-plane-env
      KAFKA_BROKERS: kafka:9092
      # The service alert rules read the telemetry store (F21, ADR-012); this
      # worker alone runs those sweeps, as the read-only account.
      CLICKHOUSE_DSN: clickhouse://nexovue_reader:${CLICKHOUSE_READER_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
      # The nightly erasure of deleted organizations (ADR-014) runs on this
      # worker, as the account that can only read and delete (users.d/eraser.xml).
      CLICKHOUSE_ERASER_DSN: clickhouse://nexovue_eraser:${CLICKHOUSE_ERASER_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
    depends_on:
      clickhouse:
        condition: service_healthy
      # Kafka carries every check result and Postgres holds this worker's job queue.
      # Starting before either loses the first results after three delivery attempts.
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # F21. Delivers alerts — email, Slack, Teams, Discord, PagerDuty, webhooks —
  # from the outbox, and nothing else: a receiver that takes its full ten seconds
  # holds one of these slots, never a probe's (plan Q1). `scheduler-light`
  # excludes this queue for the same reason.
  scheduler-deliveries:
    <<: *service-defaults
    image: *image-base
    command: python -m nexovue_scheduler worker --queues deliveries --concurrency 4
    healthcheck: *scheduler-healthcheck
    environment:
      <<: *control-plane-env
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

# TODO(backups): P1-51 owns the runbook. Volume snapshots alone do not give a
#   consistent ClickHouse or Postgres backup, and no volume here is on a
#   deliberately chosen disk yet.
  # ---------- intelligence (Phase 2) ----------
  # Detection, correlation and the LLM call that produces a plain-language
  # finding — sequential stages of one flow, so one service.
  #
  # TODO(phase-2): apps/insight does not exist yet; this describes the shape so
  #   the deployment target is complete.
  #
  # Behind a profile for the same reason as the replica: in the default set, a
  # service whose image cannot exist yet fails the pull for the whole stack.
  insight:
    profiles: ["insight"]
    <<: *service-defaults
    image: ${NEXOVUE_REGISTRY:?set NEXOVUE_REGISTRY}/insight:${NEXOVUE_VERSION:?set NEXOVUE_VERSION}
    environment:
      INSIGHT_PIPELINES: ${INSIGHT_PIPELINES:-detect,correlate,summarise}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${INSIGHT_MEMORY:-1G}

  # Self-hosted inference. Drop this service and point LLM_BASE_URL at a hosted
  # provider if you would rather not run models.
  #
  # TODO(gpu): a useful model wants a GPU. Without one this is CPU-only and
  #   slow; add the device reservation once the server's hardware is known.
  ollama:
    # Same profile as insight: its only consumer, and nothing else dials it.
    profiles: ["insight"]
    <<: *service-defaults
    image: ollama/ollama:0.12.11
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY:-8G}

volumes:
  ollama-models:
  caddy-data:
  caddy-config:
  web-assets:
