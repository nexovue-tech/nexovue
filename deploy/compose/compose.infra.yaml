# Shared infrastructure — Kafka, ClickHouse, Postgres, SeaweedFS.
#
# Every compose target pulls this in with `include:`, never with `-f` layering.
# `-f` merges sequences by APPENDING, so a dev bind mount added in one file
# would survive into the production file. `include:` keeps one definition.
#
# Memory limits are the laptop budget and use `deploy.resources.limits`, which
# Compose v2+ applies without Swarm.
#
# Credentials default to development values. Deployment targets redeclare them
# with the `:?` required form so a real environment cannot inherit a dev secret.

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      # Single-node KRaft: this container is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,HOST://:29092
      # Two client listeners: containers reach the broker as `kafka`, the host as localhost.
      # The advertised host port MUST match the published one — a client bootstraps, is told
      # where to reconnect, and hangs if that address is not actually reachable.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:${KAFKA_HOST_PORT:-19092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # base64url of a 16-byte UUID — the only shape KRaft accepts as a cluster id.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-fo8KHCs9Tl-KmwwdLj9KWw}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single node: every internal topic has exactly one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # One record is one trace's envelope, so the broker has to accept what the
      # receiver accepts (see apps/workers/internal/setup/topics.go). The replica fetch size
      # must clear it too, or a follower cannot replicate a record the leader
      # took. Both default to 1 MiB, well under a legal trace.
      KAFKA_MESSAGE_MAX_BYTES: ${KAFKA_MAX_MESSAGE_BYTES:-16781312}
      KAFKA_REPLICA_FETCH_MAX_BYTES: ${KAFKA_MAX_MESSAGE_BYTES:-16781312}
      KAFKA_HEAP_OPTS: -Xmx1g -Xms256m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Starting a JVM per probe is expensive, so probe rarely and allow a slow start.
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1536M

  clickhouse:
    image: clickhouse:26.3.20.7-jammy
    hostname: clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-nexovue}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-nexovue}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-nexovue_dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # The read-only account (users.d/reader.xml). A development default only:
      # both deployment files demand it.
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:-nexovue_reader_dev}
      # The account that can only read and delete (users.d/eraser.xml), for the
      # nightly erasure. A development default only: both deployment files demand it.
      CLICKHOUSE_ERASER_PASSWORD: ${CLICKHOUSE_ERASER_PASSWORD:-nexovue_eraser_dev}
      # No MALLOC_CONF here, and that is the conclusion rather than an omission.
      #
      # The drift is real: 2.27 GiB resident against 1.24 GiB allocated after
      # under two hours, so roughly a gigabyte sat in the allocator rather than
      # in ClickHouse. `memory.xml` records the same.
      #
      # A `background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000` was
      # set here on 2026-09-15 and reverted once it could be checked against
      # ClickHouse's source. Its compiled-in default is already
      # `…,muzzy_decay_ms:0,dirty_decay_ms:5000,…,background_thread:true,…`
      # (contrib/jemalloc-cmake/CMakeLists.txt), and MALLOC_CONF overrides only
      # the options it names. So that line was a no-op on background_thread, a
      # mild tightening of dirty_decay_ms — and it raised muzzy_decay_ms from 0
      # to 1000, telling jemalloc to *hold* muzzy pages for a second where the
      # default returns them at once. Backwards from the goal, which is why the
      # measurement never resolved.
      #
      # If this is tuned later, `dirty_decay_ms` is the only lever, muzzy stays
      # at 0, and it needs a controlled measurement rather than one sample.
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../clickhouse/users.d/reader.xml:/etc/clickhouse-server/users.d/reader.xml:ro
      - ../clickhouse/users.d/eraser.xml:/etc/clickhouse-server/users.d/eraser.xml:ro
      # One file, not the directory: config.d already holds the image's own
      # docker_related_config.xml, and mounting over it leaves ClickHouse
      # listening on loopback where no other container can reach it.
      - ../clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ../clickhouse/config.d/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ../clickhouse/config.d/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
      - ../clickhouse/config.d/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host", "127.0.0.1", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          # Raised from 3072M on 2026-09-08, because 3 GiB made the live suites
          # flaky rather than slow. ClickHouse counts its own RSS against
          # `max_server_memory_usage`, and the allocator holds memory the caches
          # have released — measured idle at 2.858 GiB of the 3 GiB cap with no
          # query running, so the next query failed MEMORY_LIMIT_EXCEEDED and
          # the same suite passed or errored by luck.
          #
          # A flaky gate is worse than a red one: it teaches people to re-run
          # rather than to read. 5 GiB restores headroom on a 24 GB machine where
          # all thirteen containers together were using 4.8 GiB.
          memory: 5120M

  postgres:
    # pgvector's image is the official Postgres image plus the extension, so the
    # Phase 2 RAG store needs no image swap. Postgres 18 for native uuidv7().
    image: pgvector/pgvector:0.8.6-pg18-trixie
    hostname: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexovue}
      POSTGRES_USER: ${POSTGRES_USER:-nexovue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexovue_dev}
    volumes:
      # Postgres 18 images moved the data directory under a version-named
      # subdirectory and refuse to start with the old /…/data mount, so that
      # `pg_upgrade --link` can work across a single mount point.
      - postgres-data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexovue} -d ${POSTGRES_DB:-nexovue}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1024M

  seaweedfs:
    image: chrislusf/seaweedfs:4.44
    hostname: seaweedfs
    command:
      - server
      - -s3
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -s3.config=/etc/seaweedfs/s3.json
      - -master.volumeSizeLimitMB=256
    volumes:
      - seaweedfs-data:/data
      - ../seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # **The S3 port, not the master's.** `weed server` brings the master up on
      # 9333 first and the S3 gateway on 8333 seconds later, so probing the master
      # declared this healthy while 8333 still refused connections — and the API,
      # which gates on this and creates its bucket at boot, exited on a cold start
      # with "could not prepare the bucket". A health check has to probe the port
      # its dependants actually call.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  kafka-data:
  clickhouse-data:
  postgres-data:
  seaweedfs-data:
