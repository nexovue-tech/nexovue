; FastAPI, Celery Beat and one Celery worker in a single container.
;
; Beat is a singleton: a second instance fires every scheduled check twice, so
; this container must never run more than one replica. Splitting beat into its
; own service is the first step when the API needs to scale.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:api]
command=uv run --package nexovue-api uvicorn nexovue_api.main:app --host 0.0.0.0 --port 8000
directory=/app
autorestart=true
startretries=3
; Logs go to the container's stdout so the platform's log driver owns rotation.
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:beat]
command=uv run --package nexovue-scheduler celery -A nexovue_scheduler.celery_app beat --scheduler nexovue_scheduler.beat:PostgresScheduler
directory=/app
autorestart=true
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=uv run --package nexovue-scheduler celery -A nexovue_scheduler.celery_app worker --queues %(ENV_CELERY_QUEUES)s --concurrency 2
directory=/app
autorestart=true
startretries=3
; Give a browser check time to finish rather than killing it mid-flow.
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
