server {
    listen 8080;
    root /usr/share/nginx/html;

    # Hashed assets never change under a given name, so they cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the SPA entry point: the router owns the path, not nginx.
    location / {
        try_files $uri /index.html;
    }
}
