# P1-62 — the OpenTelemetry Demo, pointed at our receiver.
#
# Layered over the upstream `compose.yaml` with `-f`, so this file only says
# what differs. Two things differ:
#
#   1. Where telemetry goes. Upstream keys every exporter off OTEL_COLLECTOR_HOST
#      and the two port variables, so `nexovue.env` moves all of them at once and
#      nothing here has to repeat an endpoint.
#   2. Who it says it is. Our receiver authenticates every OTLP request by the
#      `x-nexovue-key` header, and upstream wires no header anywhere — so each
#      SDK service gets OTEL_EXPORTER_OTLP_HEADERS here.
#
# Two services do not read OTEL_EXPORTER_OTLP_HEADERS, because they are not SDKs:
# `frontend-proxy` (Envoy) and `image-provider` (nginx + ngx_otel_module)
# configure their exporter in their own config file. Both got the key by having a
# patched copy of that file bind-mounted over the clone's — the clone is pinned
# and gitignored, so it is never edited in place. The patched copies live beside
# this file; each says what it changed and against which tag.

services:
  # The one container here that is ours, and the only one that is a *producer*
  # rather than one of upstream's services.
  #
  # Not upstream's `otel-collector`, which is still dropped and should stay
  # dropped — we are the backend, and nothing routes through this. It scrapes the
  # machine every demo container shares and exports the readings, because no
  # application service can report the host it runs on and the Infrastructure
  # screen has therefore been empty through every run of this demo.
  #
  # Same image as upstream's collector, referenced by upstream's own variable, so
  # there is one collector version in play rather than two.
  host-metrics:
    image: ${COLLECTOR_CONTRIB_IMAGE:?set by the demo's own .env}
    container_name: host-metrics
    command: ["--config=/etc/otelcol/host-metrics.yaml"]
    environment:
      - NEXOVUE_INGEST_KEY=${NEXOVUE_INGEST_KEY:?set NEXOVUE_INGEST_KEY}
      - NEXOVUE_OTLP_HTTP_URL=http://${OTEL_COLLECTOR_HOST}:${OTEL_COLLECTOR_PORT_HTTP}
      # Says what it is. On Docker Desktop this is the Linux VM the containers
      # share, not the laptop, and the name should not pretend otherwise.
      - NEXOVUE_DEMO_HOST_NAME=${NEXOVUE_DEMO_HOST_NAME:-otel-demo-host}
      # The demo's own Postgres password, from its .env. Passed rather than
      # written into the collector config, because the whole point of the
      # sqlquery route is that a database credential stays on the customer's
      # side — and a config file in git is not that.
      - NEXOVUE_DEMO_DB_PASSWORD=${POSTGRES_PASSWORD:?set by the demo's own .env}
    volumes:
      - ${NEXOVUE_OVERLAY_DIR:?set by otel-demo.sh}/host-metrics-collector.yaml:/etc/otelcol/host-metrics.yaml:ro
      # Read-only, and the only reason this container exists. The root mount is
      # for the filesystem scraper, which stats each mount point it finds in
      # /proc and fails every one of them without it.
      - /:/hostfs:ro
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      # `docker_stats` reads the daemon's container stats API, and this is the
      # only way to reach it. Read-only is not the reassurance it looks like —
      # the Docker socket is effectively root on the host whatever the mode — so
      # it stays in `tools/otel-demo/`, on a developer's own machine, and must
      # never appear in `deploy/compose/`.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The image runs as 10001:10001 and the socket is root:root mode 660, so the
    # receiver failed to start with "permission denied" until this. `group_add`
    # rather than `user: root`: the process stays non-root for everything else it
    # touches. It is not a security improvement in itself — reaching the Docker
    # API is root-equivalent by construction, since it can create a privileged
    # container — it just refuses to take more than the one thing needed.
    group_add: ["0"]
    deploy:
      resources:
        limits:
          # Raised from 192M when docker_stats joined: it holds a client and a
          # stats stream per container, and the demo runs twenty-one.
          memory: 320M

  ad:
    environment: &nexovue-key
      - OTEL_EXPORTER_OTLP_HEADERS=x-nexovue-key=${NEXOVUE_INGEST_KEY:?set NEXOVUE_INGEST_KEY}

  cart:
    environment: *nexovue-key

  # Two of upstream's memory limits are too tight for this platform, and both
  # services die on them rather than degrade: exit 137 in a restart loop.
  # A crash-looping service is not the telemetry this gate exists to judge, so
  # the limits are raised here rather than in the pinned clone.
  #
  # Both also carry GOMEMLIMIT=16MiB upstream, sized to the 20 MiB container.
  # Raising only the container limit stops the kill but leaves the Go runtime
  # collecting against a 16 MiB target, which trades OOM kills for GC thrash —
  # so both numbers move together. YAML cannot append to an aliased sequence, so
  # these two spell the key line out instead of using the anchor above.
  #
  # checkout: measured 62 OOM kills in one run. It is also the only Kafka
  # producer in the demo, so its crash loop takes the queue edge with it. It
  # settles at 20.2 MiB resident, i.e. exactly on the upstream limit, which is
  # why it died rather than ran slow.
  checkout:
    environment:
      - OTEL_EXPORTER_OTLP_HEADERS=x-nexovue-key=${NEXOVUE_INGEST_KEY:?set NEXOVUE_INGEST_KEY}
      - GOMEMLIMIT=96MiB
    deploy:
      resources:
        limits:
          memory: 128M

  # product-catalog: measured 22 OOM kills in ten minutes. cart, checkout,
  # recommendation and frontend all call it, so its restarts show up as
  # timeouts across most of the map.
  product-catalog:
    environment:
      - OTEL_EXPORTER_OTLP_HEADERS=x-nexovue-key=${NEXOVUE_INGEST_KEY:?set NEXOVUE_INGEST_KEY}
      - GOMEMLIMIT=96MiB
    deploy:
      resources:
        limits:
          memory: 128M

  currency:
    environment: *nexovue-key

  email:
    environment: *nexovue-key

  # The storefront reports twice, and they are different signals.
  #
  # Its server half uses the ingest key like every other service. Its *browser*
  # half — upstream's own `FrontendTracer`, which auto-instruments fetch, XHR,
  # document load and clicks — reports through the browser door instead, because
  # that is the door a page is allowed to reach: a public site key checked
  # against the Origin it was served from, never a secret one.
  #
  # It goes through Envoy's existing `/otlp-http/` route rather than straight at
  # the receiver, which buys two things. The URL is then same-origin for both the
  # person on localhost:8080 and the load generator's Chromium on
  # frontend-proxy:8080, so one string serves both; and same-origin means no
  # preflight, which the browser door would answer but which is one less thing
  # to be wrong.
  #
  # The key travels in the query string because this exporter takes its URL from
  # the environment and nothing else — there is no header to set. That is what
  # `nexovue_site_key` exists for, and it accepts only a public `nvp_live_` key.
  #
  # **This is not RUM.** It sends spans, so it fills Traces and the service map,
  # and the browser's `traceparent` reaches the backend — one trace from a click
  # to product-catalog. Web vitals are log records and arrive separately.
  frontend:
    environment:
      - OTEL_EXPORTER_OTLP_HEADERS=x-nexovue-key=${NEXOVUE_INGEST_KEY:?set NEXOVUE_INGEST_KEY}
      - PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://localhost:8080/otlp-http/browser/v1/traces?nexovue_site_key=${NEXOVUE_SITE_KEY:?set NEXOVUE_SITE_KEY}

  flagd:
    environment: *nexovue-key

  payment:
    environment: *nexovue-key

  quote:
    environment: *nexovue-key

  recommendation:
    environment: *nexovue-key

  shipping:
    environment: *nexovue-key

  # k6's browser scenario is upstream's default. We had turned it off on the
  # belief that it starts a Chromium per virtual user and "costs more memory than
  # every application service put together". Both halves were wrong, and both
  # were measured before this line was written:
  #
  #   - 3.0.0's own script.js pins that scenario at `vus: 1` whatever
  #     LOAD_GENERATOR_VUS says. One headless browser, not one per user.
  #   - the whole load-generator, Chromium included, sits at 150 MiB of its
  #     512 MiB limit.
  #
  # **It does not produce browser telemetry, and that was the reason it was
  # turned back on.** Measured over 55 completed browser iterations: zero
  # exports reached the browser door — not from our injected SDK, and not from
  # upstream's own `FrontendTracer` either. Whatever k6's browser module does
  # to page-initiated requests, it does to both equally, so this is not
  # something our injection can fix. The RUM screen is filled by a person
  # opening the storefront, or by `just load`.
  #
  # It stays on for what it does deliver: the only thing here that drives the
  # shop through a real browser, which is where `browser_add_to_cart` and
  # `browser_change_currency` come from.
  load-generator:
    environment: *nexovue-key

  # From upstream's `compose.full.yaml`. They are the only queue hop in the demo
  # — checkout produces an order, these two consume it — so they are the only
  # services that exercise the `queue` edge kind at all.
  accounting:
    environment: *nexovue-key

  fraud-detection:
    environment: *nexovue-key

  kafka:
    environment: *nexovue-key

  # The two non-SDK exporters. Neither reads OTEL_EXPORTER_OTLP_HEADERS, so each
  # gets the key through its own config file — mounted from here over the one
  # baked into the image. NEXOVUE_OVERLAY_DIR is exported by otel-demo.sh: a
  # relative host path would resolve against the *upstream* project directory.
  image-provider:
    environment:
      - NEXOVUE_INGEST_KEY=${NEXOVUE_INGEST_KEY:?set NEXOVUE_INGEST_KEY}
    volumes:
      - ${NEXOVUE_OVERLAY_DIR:?set by otel-demo.sh}/image-provider-nginx.conf.template:/nginx.conf.template:ro
      # Door 3's bundle, served from the demo's only static-file server — the
      # one Envoy already routes `/images/` to, so the browser can fetch it with
      # no new container and no new route. `dist/` is gitignored, so this fails
      # loudly when the SDK has not been built; otel-demo.sh says so by name.
      - ${NEXOVUE_BROWSER_SDK_DIST:?set by otel-demo.sh}/nexovue-rum.min.js:/static/nexovue-rum.min.js:ro
      - ${NEXOVUE_BROWSER_SDK_DIST}/nexovue-rum.min.js.map:/static/nexovue-rum.min.js.map:ro
    # Upstream's own CMD, with NEXOVUE_INGEST_KEY added to the envsubst list —
    # envsubst substitutes only the names it is given — and with upstream's
    # `cat /etc/nginx/nginx.conf` dropped, which would print the key to the log.
    command:
      - /bin/sh
      - -c
      - envsubst '$$OTEL_COLLECTOR_HOST $$IMAGE_PROVIDER_PORT $$OTEL_COLLECTOR_PORT_GRPC $$OTEL_SERVICE_NAME $$NEXOVUE_INGEST_KEY' < /nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'

  frontend-proxy:
    environment:
      - NEXOVUE_INGEST_KEY=${NEXOVUE_INGEST_KEY:?set NEXOVUE_INGEST_KEY}
      # Both are substituted into the Lua filter's injected script by the image's
      # own entrypoint. The site key is public by design — it is checked against
      # the Origin it was served from, not kept secret — which is what lets it sit
      # in a page anyone can read.
      - NEXOVUE_SITE_KEY=${NEXOVUE_SITE_KEY:?set NEXOVUE_SITE_KEY}
      - NEXOVUE_RUM_RELEASE=${NEXOVUE_RUM_RELEASE:?set NEXOVUE_RUM_RELEASE}
    volumes:
      - ${NEXOVUE_OVERLAY_DIR:?set by otel-demo.sh}/frontend-proxy-envoy.tmpl.yaml:/home/envoy/envoy.tmpl.yaml:ro

  # Door 5. From `compose.profiling.yaml`, which this project's only other
  # service — `firepit`, upstream's own profiling UI — is deliberately left
  # out of: nexovue has its own Profiles screen, and firepit's default port is
  # 8080, which the storefront already owns.
  #
  # Like image-provider and frontend-proxy, this exporter reads no
  # OTEL_EXPORTER_OTLP_HEADERS — it is a static Collector config, not an SDK —
  # so the key is patched into a copy of its own file instead. Unlike those
  # two, the Collector expands `${env:NAME}` on its own; there is no envsubst
  # step to extend, so the environment variable and the patched file are the
  # whole change.
  otel-ebpf-profiler:
    environment:
      - NEXOVUE_INGEST_KEY=${NEXOVUE_INGEST_KEY:?set NEXOVUE_INGEST_KEY}
    volumes:
      - ${NEXOVUE_OVERLAY_DIR:?set by otel-demo.sh}/otelcol-ebpf-profiling.yml:/etc/nexovue-ebpf-profiler-config.yaml:ro
    # Replaces upstream's command outright — compose does not merge this field
    # — to point at the patched file above instead of the pinned clone's.
    command:
      - --config=/etc/nexovue-ebpf-profiler-config.yaml
      - --feature-gates=service.profilesSupport
