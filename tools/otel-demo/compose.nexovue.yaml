# P1-62 — the OpenTelemetry Demo, pointed at our receiver.
#
# Layered over the upstream `compose.yaml` with `-f`, so this file only says
# what differs. Two things differ:
#
#   1. Where telemetry goes. Upstream keys every exporter off OTEL_COLLECTOR_HOST
#      and the two port variables, so `nexovue.env` moves all of them at once and
#      nothing here has to repeat an endpoint.
#   2. Who it says it is. Our receiver authenticates every OTLP request by the
#      `x-nexovue-key` header, and upstream wires no header anywhere — so each
#      SDK service gets OTEL_EXPORTER_OTLP_HEADERS here.
#
# Two services do not read OTEL_EXPORTER_OTLP_HEADERS, because they are not SDKs:
# `frontend-proxy` (Envoy) and `image-provider` (nginx + ngx_otel_module)
# configure their exporter in their own config file. Both got the key by having a
# patched copy of that file bind-mounted over the clone's — the clone is pinned
# and gitignored, so it is never edited in place. The patched copies live beside
# this file; each says what it changed and against which tag.

services:
  ad:
    environment: &nexovue-key
      - OTEL_EXPORTER_OTLP_HEADERS=x-nexovue-key=${NEXOVUE_INGEST_KEY:?set NEXOVUE_INGEST_KEY}

  cart:
    environment: *nexovue-key

  # Two of upstream's memory limits are too tight for this platform, and both
  # services die on them rather than degrade: exit 137 in a restart loop.
  # A crash-looping service is not the telemetry this gate exists to judge, so
  # the limits are raised here rather than in the pinned clone.
  #
  # Both also carry GOMEMLIMIT=16MiB upstream, sized to the 20 MiB container.
  # Raising only the container limit stops the kill but leaves the Go runtime
  # collecting against a 16 MiB target, which trades OOM kills for GC thrash —
  # so both numbers move together. YAML cannot append to an aliased sequence, so
  # these two spell the key line out instead of using the anchor above.
  #
  # checkout: measured 62 OOM kills in one run. It is also the only Kafka
  # producer in the demo, so its crash loop takes the queue edge with it. It
  # settles at 20.2 MiB resident, i.e. exactly on the upstream limit, which is
  # why it died rather than ran slow.
  checkout:
    environment:
      - OTEL_EXPORTER_OTLP_HEADERS=x-nexovue-key=${NEXOVUE_INGEST_KEY:?set NEXOVUE_INGEST_KEY}
      - GOMEMLIMIT=96MiB
    deploy:
      resources:
        limits:
          memory: 128M

  # product-catalog: measured 22 OOM kills in ten minutes. cart, checkout,
  # recommendation and frontend all call it, so its restarts show up as
  # timeouts across most of the map.
  product-catalog:
    environment:
      - OTEL_EXPORTER_OTLP_HEADERS=x-nexovue-key=${NEXOVUE_INGEST_KEY:?set NEXOVUE_INGEST_KEY}
      - GOMEMLIMIT=96MiB
    deploy:
      resources:
        limits:
          memory: 128M

  currency:
    environment: *nexovue-key

  email:
    environment: *nexovue-key

  frontend:
    environment: *nexovue-key

  flagd:
    environment: *nexovue-key

  payment:
    environment: *nexovue-key

  quote:
    environment: *nexovue-key

  recommendation:
    environment: *nexovue-key

  shipping:
    environment: *nexovue-key

  load-generator:
    environment:
      - OTEL_EXPORTER_OTLP_HEADERS=x-nexovue-key=${NEXOVUE_INGEST_KEY:?set NEXOVUE_INGEST_KEY}
      # k6's browser mode starts a headless Chromium per virtual user. It costs
      # more memory than every application service put together and adds one
      # more node to the map, not one more language.
      - K6_BROWSER_ENABLED=false

  # From upstream's `compose.full.yaml`. They are the only queue hop in the demo
  # — checkout produces an order, these two consume it — so they are the only
  # services that exercise the `queue` edge kind at all.
  accounting:
    environment: *nexovue-key

  fraud-detection:
    environment: *nexovue-key

  kafka:
    environment: *nexovue-key

  # The two non-SDK exporters. Neither reads OTEL_EXPORTER_OTLP_HEADERS, so each
  # gets the key through its own config file — mounted from here over the one
  # baked into the image. NEXOVUE_OVERLAY_DIR is exported by otel-demo.sh: a
  # relative host path would resolve against the *upstream* project directory.
  image-provider:
    environment:
      - NEXOVUE_INGEST_KEY=${NEXOVUE_INGEST_KEY:?set NEXOVUE_INGEST_KEY}
    volumes:
      - ${NEXOVUE_OVERLAY_DIR:?set by otel-demo.sh}/image-provider-nginx.conf.template:/nginx.conf.template:ro
    # Upstream's own CMD, with NEXOVUE_INGEST_KEY added to the envsubst list —
    # envsubst substitutes only the names it is given — and with upstream's
    # `cat /etc/nginx/nginx.conf` dropped, which would print the key to the log.
    command:
      - /bin/sh
      - -c
      - envsubst '$$OTEL_COLLECTOR_HOST $$IMAGE_PROVIDER_PORT $$OTEL_COLLECTOR_PORT_GRPC $$OTEL_SERVICE_NAME $$NEXOVUE_INGEST_KEY' < /nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'

  frontend-proxy:
    environment:
      - NEXOVUE_INGEST_KEY=${NEXOVUE_INGEST_KEY:?set NEXOVUE_INGEST_KEY}
    volumes:
      - ${NEXOVUE_OVERLAY_DIR:?set by otel-demo.sh}/frontend-proxy-envoy.tmpl.yaml:/home/envoy/envoy.tmpl.yaml:ro
