# P1-62 — the demo's Envoy (`frontend-proxy`), pointed at our receiver *with a key*.
#
# A verbatim copy of upstream `src/frontend-proxy/envoy.tmpl.yaml` at tag 3.0.0,
# with three changes:
#
#   1. `initial_metadata` on the two `grpc_service` blocks that export to us —
#      the tracer's and the OpenTelemetry access logger's. Envoy configures its
#      exporter here and not from OTEL_EXPORTER_OTLP_HEADERS, so without these
#      every span and every access log it exports is refused 401 at our door.
#   2. `dns_lookup_family` on the two collector clusters, so Envoy dials the
#      address our receiver actually listens on. See the comment there.
#   3. A Lua filter that puts our browser SDK on every page the storefront
#      serves. It goes here rather than in the frontend's own `_document.tsx`
#      because that image is pulled prebuilt and the clone is never edited in
#      place — this file is already patched and already mounted, so it is the
#      one place upstream's behaviour can be changed without a rebuild.
#
# `initial_metadata` is a top-level field of GrpcService and exists "for
# scenarios in which additional ad hoc authorization headers ... are to be
# injected" —
# https://www.envoyproxy.io/docs/envoy/latest/api-v3/config/core/v3/grpc_service.proto
#
# ${NEXOVUE_INGEST_KEY}, ${NEXOVUE_SITE_KEY} and ${NEXOVUE_RUM_RELEASE} are
# substituted by the image's own entrypoint, which runs envsubst over this file
# with no variable list and so expands every ${...} in it. That is also why the
# injected JavaScript below contains no dollar sign at all: a template literal
# or a jQuery-style name would be eaten before Envoy ever saw it.
#
# Re-check this file against the clone whenever UPSTREAM_REF moves.
# Copyright The OpenTelemetry Authors
# SPDX-License-Identifier: Apache-2.0

static_resources:
  listeners:
    - address:
        socket_address:
          address: "${ENVOY_ADDR}"
          port_value: ${ENVOY_PORT}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_http
                tracing:
                  spawn_upstream_span: true
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc:
                          cluster_name: opentelemetry_collector_grpc
                        timeout: 0.250s
                        initial_metadata:
                          - key: x-nexovue-key
                            value: ${NEXOVUE_INGEST_KEY}
                      service_name: ${OTEL_SERVICE_NAME}
                      resource_detectors:
                        - name: envoy.tracers.opentelemetry.resource_detectors.environment
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.tracers.opentelemetry.resource_detectors.v3.EnvironmentResourceDetectorConfig
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: frontend
                      domains:
                        - "*"
                      routes:
                        - match: { prefix: "/otlp-http/" }
                          route: { cluster: opentelemetry_collector_http, prefix_rewrite: "/" }
                        - match: { path: "/jaeger" }
                          redirect: { path_redirect: "/jaeger/" }
                        - match: { prefix: "/jaeger/" }
                          route: { cluster: jaeger }
                        - match: { path: "/grafana" }
                          redirect: { path_redirect: "/grafana/" }
                        - match: { prefix: "/grafana/" }
                          route: { cluster: grafana }
                        - match: { path: "/opamp" }
                          redirect: { path_redirect: "/opamp/" }
                        - match: { prefix: "/opamp/" }
                          route: { cluster: opamp, prefix_rewrite: "/" }
                        - match: { path: "/telemetry" }
                          redirect: { path_redirect: "/telemetry/" }
                        - match: { prefix: "/telemetry/" }
                          route: { cluster: telemetry-docs, prefix_rewrite: "/" }
                        - match: { prefix: "/images/" }
                          route: { cluster: image-provider, prefix_rewrite: "/" }
                        - match: { prefix: "/flagservice/" }
                          route: { cluster: flagservice, prefix_rewrite: "/", timeout: 0s }
                        - match: { prefix: "/feature" }
                          route:
                            cluster: flagd-ui
                            prefix_rewrite: "/"
                            upgrade_configs:
                              - upgrade_type: websocket
                        - match: { path: "/profiles" }
                          redirect: { path_redirect: "/profiles/" }
                        - match: { prefix: "/profiles/" }
                          route: { cluster: profiles }
                        - match: { path: "/chatbot" }
                          redirect: { path_redirect: "/chatbot/" }
                        - match: { prefix: "/chatbot/" }
                          route:
                            cluster: chatbot
                            prefix_rewrite: "/"
                            timeout: 0s
                            upgrade_configs:
                              - upgrade_type: websocket
                        - match: { prefix: "/" }  # Default/catch-all route - keep last since prefix:"/" matches everything
                          route: { cluster: frontend }
                http_filters:
                  - name: envoy.filters.http.fault
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                      max_active_faults: 100
                      delay:
                        header_delay: {}
                        percentage:
                          numerator: 100
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          -- Our browser SDK, on every page the storefront serves.
                          --
                          -- The bundle is served by image-provider, which this proxy already
                          -- routes /images/ to, so the browser fetches and caches it like any
                          -- other static file.
                          --
                          -- flushIntervalMs is 3s here against the SDK's own 10s default, and it
                          -- is demo configuration rather than a product opinion. The load
                          -- generator's browser opens a page, clicks twice and closes it in about
                          -- five seconds — measured — so at the default it died before its first
                          -- flush every time, and the unload beacon queued as the renderer is torn
                          -- down does not reliably survive. A human reading the shop is unaffected
                          -- either way.
                          --
                          -- The endpoint is location.origin .. "/otlp-http", and that one string
                          -- is why this works for both readers: a person on localhost:8080 and
                          -- the load generator's Chromium on frontend-proxy:8080 each resolve it
                          -- to their own origin. It is also same-origin, so there is no preflight
                          -- to answer — and the browser still sends Origin on a same-origin POST,
                          -- which is what the door checks.
                          local SNIPPET = [==[<script src="/images/nexovue-rum.min.js"></script><script>window.nexovue&&nexovue.init({siteKey:"${NEXOVUE_SITE_KEY}",endpoint:location.origin+"/otlp-http",serviceName:"frontend-web",serviceVersion:"${NEXOVUE_RUM_RELEASE}",flushIntervalMs:3000,route:(function(p){return p.indexOf("/product/")===0?"/product/{id}":p})(location.pathname)})</script>]==]

                          function envoy_on_request(handle)
                            -- Next.js compresses its own HTML and Lua sees the bytes on the wire,
                            -- so a compressed body would be unreadable here. Asked for identity on
                            -- document loads only, which leaves /images and /otlp-http alone.
                            if handle:headers():get("sec-fetch-dest") == "document" then
                              handle:headers():remove("accept-encoding")
                            end
                          end

                          function envoy_on_response(handle)
                            local headers = handle:headers()
                            local content_type = headers:get("content-type")
                            if content_type == nil then return end
                            if string.find(content_type, "text/html", 1, true) == nil then return end
                            -- Compressed anyway: skip rather than corrupt the page.
                            if headers:get("content-encoding") ~= nil then return end

                            -- Dropped *before* the body is buffered, and that order is the whole
                            -- of it: by the time handle:body() returns, these headers have already
                            -- gone downstream, so a length written afterwards changes nothing.
                            -- Measured with it written afterwards: the header still said 11549
                            -- while 11882 bytes were sent, which truncates the end of the page in
                            -- any client that believes it. Removing it lets Envoy frame the
                            -- response itself, which it can do correctly and we cannot.
                            headers:remove("content-length")

                            local body = handle:body()
                            if body == nil or body:length() == 0 then return end
                            local page = tostring(body:getBytes(0, body:length()))
                            local head_end = string.find(page, "</head>", 1, true)
                            -- No head to inject into is a response this filter has no business
                            -- rewriting, so it is left exactly as it arrived.
                            if head_end == nil then return end

                            local rewritten = string.sub(page, 1, head_end - 1) .. SNIPPET .. string.sub(page, head_end)
                            body:setBytes(rewritten)
                          end
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                access_log:
                  - name: envoy.access_loggers.open_telemetry
                    typed_config:
                      "@type": "type.googleapis.com/envoy.extensions.access_loggers.open_telemetry.v3.OpenTelemetryAccessLogConfig"
                      stat_prefix: otel_envoy_access_log
                      log_name: "otel_envoy_access_log"
                      grpc_service:
                        envoy_grpc:
                          cluster_name: opentelemetry_collector_grpc
                        initial_metadata:
                          - key: x-nexovue-key
                            value: ${NEXOVUE_INGEST_KEY}
                      body:
                        # yamllint disable-line rule:line-length
                        string_value: "[%START_TIME%] \"%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%\" %RESPONSE_CODE% %RESPONSE_FLAGS% %RESPONSE_CODE_DETAILS% %CONNECTION_TERMINATION_DETAILS% \"%UPSTREAM_TRANSPORT_FAILURE_REASON%\" %BYTES_RECEIVED% %BYTES_SENT% %DURATION% %RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)% \"%REQ(X-FORWARDED-FOR)%\" \"%REQ(USER-AGENT)%\" \"%REQ(X-REQUEST-ID)%\" \"%REQ(:AUTHORITY)%\" \"%UPSTREAM_HOST%\" %UPSTREAM_CLUSTER% %UPSTREAM_LOCAL_ADDRESS% %DOWNSTREAM_LOCAL_ADDRESS% %DOWNSTREAM_REMOTE_ADDRESS% %REQUESTED_SERVER_NAME% %ROUTE_NAME%\n"
                      resource_attributes:
                        values:
                          - key: "service.name"
                            value:
                              string_value: ${OTEL_SERVICE_NAME}
                          - key: "service.namespace"
                            value:
                              string_value: ${OTEL_SERVICE_NAMESPACE}
                      attributes:
                        values:
                          - key: "destination.address"
                            value:
                              string_value: "%UPSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                          - key: "event.name"
                            value:
                              string_value: "proxy.access"
                          - key: "server.address"
                            value:
                              string_value: "%DOWNSTREAM_LOCAL_ADDRESS%"
                          - key: "source.address"
                            value:
                              string_value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                          - key: "upstream.cluster"
                            value:
                              string_value: "%UPSTREAM_CLUSTER%"
                          - key: "upstream.host"
                            value:
                              string_value: "%UPSTREAM_HOST%"
                          - key: "user_agent.original"
                            value:
                              string_value: "%REQ(USER-AGENT)%"
                          - key: "url.full"
                            value:
                              string_value: "%REQ(:SCHEME)%://%REQ(:AUTHORITY)%%REQ(:PATH)%"
                          - key: "url.path"
                            value:
                              string_value: "%REQ(:PATH)%"
                          - key: "url.query"
                            value:
                              string_value: "%REQ(:QUERY)%"
                          - key: "url.template"
                            value:
                              string_value: "%ROUTE_NAME%"
  clusters:
    - name: opentelemetry_collector_grpc
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      # Docker Desktop answers host.docker.internal with an AAAA record
      # nothing listens on, and Envoy's default AUTO prefers it: measured
      # 254 connect failures and zero requests before this line.
      dns_lookup_family: V4_PREFERRED
      typed_dns_resolver_config: &dns_resolver
        name: envoy.network.dns_resolver.cares
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.network.dns_resolver.cares.v3.CaresDnsResolverConfig
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: opentelemetry_collector_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${OTEL_COLLECTOR_HOST}
                      port_value: ${OTEL_COLLECTOR_PORT_GRPC}
    - name: opentelemetry_collector_http
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      # Docker Desktop answers host.docker.internal with an AAAA record
      # nothing listens on, and Envoy's default AUTO prefers it: measured
      # 254 connect failures and zero requests before this line.
      dns_lookup_family: V4_PREFERRED
      typed_dns_resolver_config: *dns_resolver
      load_assignment:
        cluster_name: opentelemetry_collector_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${OTEL_COLLECTOR_HOST}
                      port_value: ${OTEL_COLLECTOR_PORT_HTTP}
    - name: frontend
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_dns_resolver_config: *dns_resolver
      load_assignment:
        cluster_name: frontend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${FRONTEND_HOST}
                      port_value: ${FRONTEND_PORT}
    - name: image-provider
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_dns_resolver_config: *dns_resolver
      load_assignment:
        cluster_name: image-provider
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${IMAGE_PROVIDER_HOST}
                      port_value: ${IMAGE_PROVIDER_PORT}
    - name: flagservice
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_dns_resolver_config: *dns_resolver
      load_assignment:
        cluster_name: flagservice
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${FLAGD_HOST}
                      port_value: ${FLAGD_PORT}
    - name: flagd-ui
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_dns_resolver_config: *dns_resolver
      load_assignment:
        cluster_name: flagd-ui
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${FLAGD_UI_HOST}
                      port_value: ${FLAGD_UI_PORT}
    - name: grafana
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_dns_resolver_config: *dns_resolver
      load_assignment:
        cluster_name: grafana
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${GRAFANA_HOST}
                      port_value: ${GRAFANA_PORT}
    - name: jaeger
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_dns_resolver_config: *dns_resolver
      load_assignment:
        cluster_name: jaeger
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${JAEGER_HOST}
                      port_value: ${JAEGER_UI_PORT}
    - name: opamp
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_failure_refresh_rate: { base_interval: 10s, max_interval: 30s }
      typed_dns_resolver_config: *dns_resolver
      load_assignment:
        cluster_name: opamp
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${OPAMP_SERVER_HOST}
                      port_value: ${OPAMP_SERVER_UI_PORT}
    - name: telemetry-docs
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_dns_resolver_config: *dns_resolver
      load_assignment:
        cluster_name: telemetry-docs
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${TELEMETRY_DOCS_HOST}
                      port_value: ${TELEMETRY_DOCS_PORT}
    - name: chatbot
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      typed_dns_resolver_config: *dns_resolver
      load_assignment:
        cluster_name: chatbot
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${CHATBOT_HOST}
                      port_value: ${CHATBOT_PORT}
    - name: profiles
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: profiles
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ${FIREPIT_HOST}
                      port_value: ${FIREPIT_PORT}
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: ${ENVOY_ADMIN_PORT}
layered_runtime:
  layers:
    - name: static_layer_0
      static_layer:
        envoy:
          resource_limits:
            listener:
              example_listener_name:
                connection_limit: 10000
