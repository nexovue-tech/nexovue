# A standalone project, apart from the root workspace: the simulation needs numpy and scipy, which
# no service does. Run it from the repository root with `uv run --project tools/detection-sim`.
[project]
name = "nexovue-detection-sim"
version = "0.1.0"
description = "F6 anomaly-detection simulation: false findings and fault catching on synthetic traffic"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "scipy-stubs==1.18.1.1",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
