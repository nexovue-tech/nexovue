[project]
name = "nexovue"
version = "0.1.0"
description = "Insight-first observability platform"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

[tool.uv.workspace]
members = ["apps/api", "apps/scheduler", "packages/py-platform"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "protobuf>=7.36",          # runtime for the generated envelope bindings
    "opentelemetry-proto>=1.44",  # test-only: proves a payload parses as the OTLP request its signal names
    "types-protobuf",
    # PyYAML ships no annotations; the import package reads OpenAPI YAML with it.
    "types-PyYAML",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # The API's tests and FastAPI's TestClient both drive httpx directly. It was
    # undeclared until now and arrived only as a transitive dependency of the
    # scheduler, so removing it there broke a suite that never named it.
    "httpx>=0.28",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api/src", "apps/scheduler/src"]
extend-exclude = ["packages/contracts/gen"]   # generated code is not ours to lint

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # naming — intention-revealing names are a standard here, not a preference
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # shadowed builtins
    "C4",        # comprehensions
    "DTZ",       # naive datetimes: every timestamp in this system is timezone-aware
    "T20",       # no print(); we have a structured logger
    "SIM",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
# A command-line tool's output *is* its interface. The services log through
# structlog because something reads those logs later; this one is read by the
# person who just typed the command, next to a bash script doing the same.
"tools/**" = ["T201"]
# The same rule, and the same reason. `suspend` is the ingest stop valve's
# operator half (P1-52): its reader is the person who just typed
# `just suspend-close` at 3am, and `suspend-show` prints rows meant to be piped.
# It lives under the API package because it needs the models and the DSN, not
# because it is part of the service.
"apps/api/src/nexovue_api/suspend.py" = ["T201"]
# The same again for creating staff (F31): its reader is the person at the
# terminal, who has to see the authenticator URI and type the code back.
"apps/api/src/nexovue_api/staff/__main__.py" = ["T201"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_explicit = false          # Map-typed telemetry attributes are legitimately dynamic
plugins = ["pydantic.mypy"]
exclude = [
    "packages/contracts/gen/",   # generated code is not ours to type
    "tools/otel-demo/upstream/", # P1-62 pins a clone of the OTel Demo; upstream code, not ours
]
# tests/helpers holds `live`, the shared "fail rather than skip" guard.
mypy_path = ["packages/contracts/gen/python", "tests/helpers"]  # ...but it must still resolve

[[tool.mypy.overrides]]
module = ["clickhouse_connect.*", "celery.*", "kombu.*", "pycurl.*", "confluent_kafka.*", "boto3.*", "botocore.*", "asyncpg.*", "re2.*"]
ignore_missing_imports = true

# The exclude above skips generated files, but a stub our code imports is still
# checked; protoc's stubs are not ours to type either.
[[tool.mypy.overrides]]
module = ["nexovue.v1.*"]
ignore_errors = true

# Celery ships no type information, so `celery.beat.Scheduler` is Any and strict
# mode refuses the subclass. The subclass is the documented extension point --
# compose names it as beat's --scheduler -- so the rule is relaxed for this
# module alone rather than globally.
[[tool.mypy.overrides]]
module = ["nexovue_scheduler.beat"]
disallow_subclassing_any = false

# Celery's @app.task is untyped for the same reason, and decorating with it
# would otherwise make every task untyped. Scoped to the task module so the rule
# still applies everywhere else.
[[tool.mypy.overrides]]
module = [
    "nexovue_scheduler.probes.tasks",
    "nexovue_scheduler.pollers.tasks",
    "nexovue_scheduler.alerts.tasks",
    "nexovue_scheduler.alerts.sweeps",
]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tests/helpers holds `live`, the shared "a live suite fails rather than skips"
# guard. It sits above the apps because the API and the scheduler both need it.
pythonpath = ["tests/helpers", "packages/contracts/gen/python"]
# Test tenants' ClickHouse rows are deleted once at the end of the run: a mutation
# per test held thousands of superseded parts in memory (tests/helpers/clickhouse_cleanup.py).
addopts = "-p clickhouse_cleanup"
testpaths = ["apps/api/tests", "apps/scheduler/tests", "packages/contracts/tests", "packages/py-platform/tests"]

[tool.uv.sources]
nexovue-platform = { workspace = true }
